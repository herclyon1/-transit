<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大阪府 车站可达性图 v1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0e0f12;--fg:#e8e8e8;--sub:#9aa0a8;--line:#2a2d33;--panel:#16181df2;
  --panelbd:#333;--pop:#1c1f25;--popfg:#eee;--popdim:#9aa0a8;--acc:#ffd54f;
  --track:#fff;--trackop:0.30;--dim:#5b626c;--dimbd:#3a3f47;--ring:#fff;
  --shadow:0 1px 3px #000;--btn:#22252c}
html[data-theme=light]{--bg:#f7f7f9;--fg:#1b1e23;--sub:#5a626c;--line:#d9dde3;
  --panel:#fffffff2;--panelbd:#c9ced6;--pop:#fff;--popfg:#1b1e23;--popdim:#6b7280;
  --acc:#a37f00;--track:#6b7480;--trackop:0.55;--dim:#aab1ba;--dimbd:#868d96;
  --ring:#1b1e23;--shadow:0 1px 3px #0003;--btn:#eef0f3}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:'Noto Sans CJK SC','Hiragino Sans','Yu Gothic',sans-serif}
#hdr{padding:8px 12px 6px;background:var(--bg);border-bottom:1px solid var(--line);
  position:relative}
#hdr h1{font-size:15px;margin:0;font-weight:700;padding-right:88px}
#hdr .sub{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4;padding-right:88px}
#map{position:absolute;top:64px;bottom:0;left:0;right:0;background:var(--bg)}
.leaflet-container{background:var(--bg)}
.hubstar{font-size:20px;line-height:20px;text-shadow:0 0 4px #000,0 0 8px #000}
.hublbl{font-size:12px;font-weight:700;color:var(--fg);text-shadow:var(--shadow);
  white-space:nowrap}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--pop);color:var(--popfg)}
.leaflet-popup-content{margin:9px 11px;font-size:13px;line-height:1.5}
button{font-family:inherit;cursor:pointer;background:var(--btn);color:var(--fg);
  border:1px solid var(--panelbd);border-radius:7px}
#theme{position:absolute;right:10px;top:10px;padding:5px 9px;font-size:12px}

/* 使用頻度の高い操作だけ常時表示の細いバーに置き、説明の壁は折りたたむ */
#panel{position:absolute;left:8px;top:72px;z-index:900;width:206px;
  display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 84px)}
#bar{background:var(--panel);flex:0 0 auto;
  border:1px solid var(--panelbd);border-radius:10px;padding:8px 10px;
  box-shadow:0 2px 10px #0003}
#bar .top{display:flex;align-items:center;justify-content:space-between;font-size:12px;
  font-weight:700}
#bar .val{color:var(--acc)}
input[type=range]{width:100%;margin:3px 0 5px;accent-color:var(--acc)}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:2px 0}
#stat{color:var(--sub);font-size:10.5px;margin-top:4px;line-height:1.45}
#more{width:100%;margin-top:7px;padding:4px 0;font-size:11.5px}
#info{position:relative;background:var(--panel);flex:1 1 auto;min-height:0;
  border:1px solid var(--panelbd);border-radius:10px;padding:10px 12px;
  overflow:auto;-webkit-overflow-scrolling:touch;
  font-size:12px;box-shadow:0 2px 12px #0005}
#info[hidden]{display:none}
#info h2{font-size:12px;margin:0 0 6px;font-weight:700}
#info .close{position:absolute;right:8px;top:8px;padding:2px 7px;font-size:12px}
.row{display:flex;align-items:center;gap:7px;padding:2.5px 0}
.sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;border:1px solid #0006;
  box-sizing:border-box}
.note{color:var(--sub);font-size:10.5px;line-height:1.5;margin-top:9px;
  border-top:1px solid var(--line);padding-top:8px}
.warn{color:#c0392b}
html[data-theme=dark] .warn{color:#ff8a80}
@media (max-width:620px){
  #panel{width:min(62vw,182px);top:68px;left:6px;max-height:calc(100% - 78px)}
  #bar{padding:7px 8px}
  #hdr h1{font-size:14px}#map{top:60px}
}
</style>
</head>
<body>
<div id="hdr">
  <h1>大阪府 车站可达性图 <span style="color:var(--sub);font-size:11px">v1 · 时间层</span></h1>
  <div class="sub">色 = 最快到达的枢纽 · 点大小 = 阈值内可达枢纽数 · 点站看四元组</div>
  <button id="theme" title="切换明暗主题">🌙 暗色</button>
</div>
<div id="map"></div>

<div id="panel">
<div id="bar">
  <div class="top"><span>阈值</span><span class="val" id="thv">25 分</span></div>
  <input type="range" id="th" min="15" max="40" step="1" value="25">
  <label class="tg"><input type="checkbox" id="lowfreq">
    <span>含低频优等 <span style="color:var(--acc)">⚡</span></span></label>
  <label class="tg"><input type="checkbox" id="areaOn">
    <span>面覆盖（＋步行）</span></label>
  <div id="walkWrap" hidden>
    <div class="top"><span>步行</span><span class="val" id="wkv">10 分</span></div>
    <input type="range" id="wk" min="0" max="20" step="1" value="10">
  </div>
  <div id="stat"></div>
  <button id="more">图例与说明 ▾</button>
</div>

<div id="info" hidden>
  <button class="close" id="closeInfo">✕</button>
  <h2>可达枢纽</h2>
  <div id="lg"></div>
  <div class="note" id="note">载入中…</div>
</div>
</div>

<script>
const HUBS = ['梅田','難波','天王寺','京橋'];
// 暗色用と浅色用で別に持つ。暗色の色をそのまま白背景に置くとコントラストが
// 2.2〜3.0:1 しか出ず読めない（WCAG の非テキスト下限は3:1）。
// 浅色用は同じ色相のまま、白背景で3.5:1 以上になる範囲で最も明るい明度を選んである。
const PALETTE = {
  dark:  {'梅田':[255,82,82], '難波':[77,163,255], '天王寺':[102,187,106],
          '京橋':[232,121,249], GOLD:[255,199,0]},
  light: {'梅田':[255,41,41], '難波':[10,128,255], '天王寺':[52,149,57],
          '京橋':[222,10,255], GOLD:[163,127,0]},
};
let THEME = (localStorage.getItem('theme') === 'light') ? 'light' : 'dark';
let HUE = PALETTE[THEME], GOLD = HUE.GOLD;
const HUB_LL = {'梅田':[34.7025,135.4959],'難波':[34.6636,135.5008],
                '天王寺':[34.6465,135.5140],'京橋':[34.6968,135.5340]};
const PROV_LABEL = {measured:'实测', anchored:'锚定', borrowed:'借用估算'};
const cssvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const map = L.map('map',{zoomControl:false}).setView([34.66,135.52],11);
L.control.zoom({position:'bottomright'}).addTo(map);
const TILES = {dark:'dark_all', light:'light_all'};
let tiles = null;
function setTiles(){
  if(tiles) map.removeLayer(tiles);
  tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/'+TILES[THEME]+'/{z}/{x}/{y}{r}.png',
    {attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
  tiles.bringToBack();
}

// 軌道幾何（v0と同じ細線。線名を持たないデータなので一律）
const lineLayer = L.layerGroup().addTo(map);
let redrawLines = ()=>{};
fetch('lines_osaka.json').then(r=>r.json()).then(ls=>{
  const draw = ()=>{
    lineLayer.clearLayers();
    const w = map.getZoom()>=13?1.6:(map.getZoom()>=11?1.0:0.7);
    const tc = cssvar('--track'), to = parseFloat(cssvar('--trackop'));
    for(const l of ls) L.polyline(l.c,{color:tc,opacity:to,weight:w,interactive:false})
      .addTo(lineLayer);
  };
  redrawLines = draw;
  draw(); let lastB=null;
  map.on('zoomend',()=>{const b=map.getZoom()>=13?2:(map.getZoom()>=11?1:0);
    if(b!==lastB){lastB=b;draw();}});
});

for(const [nm,ll] of Object.entries(HUB_LL)){
  L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="hubstar">⭐</div>',
    iconSize:[20,20],iconAnchor:[10,10]}),interactive:false}).addTo(map);
  L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="hublbl">'+nm+'</div>',
    iconAnchor:[-11,-2]}),interactive:false}).addTo(map);
}

// 複数枢纽に届く駅を混色で塗ると識別不能になる。
// 赤+青+緑を平均すると rgb(133,134,148) ＝ ほぼ灰色で、
// 「到達不能の灰」と見分けが付かなくなっていた（実際に3枢纽に届く今宮戎が灰色に化けた）。
// なので色は「最も速く着く枢纽」1つで決め、届く枢纽の数は大きさと輪郭で表す。
function fastestHub(t){
  let bi=-1, bv=Infinity;
  t.forEach((v,i)=>{ if(v!==null && v<bv){ bv=v; bi=i; } });
  return bi;
}
const css = c => 'rgb('+c[0]+','+c[1]+','+c[2]+')';

let DATA=null, layer=L.layerGroup().addTo(map);

const WALK_M_PER_MIN = 80;   // 4.8km/h。直線距離で見るので河川・高速などの障壁は無視している

// 面カバレッジ: 画面をセル格子に切り、各セルについて
//   ある枢纽hへの総時間 = min over 駅s ( 軌道時間(s→h) + 徒歩時間(セル→s) )
//   ただし 軌道時間 ≤ 閾値A かつ 徒歩 ≤ 閾値B
// を求め、4枢纽のうち最小のものの色で塗る。混色はしない。
// セル毎に全駅を舐めると重いので、駅ごとに半径Bの円をスタンプして最小値を更新する。
// 格子のまま描くとブロック状になるので、格子解像度の小さいcanvasに描いてから
// 平滑化を効かせて拡大する。
const AreaLayer = L.Layer.extend({
  onAdd(map){
    this._map = map;
    this._c = L.DomUtil.create('canvas');
    this._c.style.pointerEvents = 'none';
    map.getPanes().overlayPane.appendChild(this._c);
    map.on('moveend zoomend resize', this._reset, this);
    // ズーム中は canvas が CSS 変形で引き伸ばされ、古い絵が残って汚いので隠す
    this._hide = ()=>{ this._c.style.opacity = '0'; };
    map.on('zoomstart', this._hide);
    this._reset();
  },
  onRemove(map){
    map.off('moveend zoomend resize', this._reset, this);
    map.off('zoomstart', this._hide);
    L.DomUtil.remove(this._c);
  },
  _reset(){
    const map = this._map, size = map.getSize();
    L.DomUtil.setPosition(this._c, map.containerPointToLayerPoint([0,0]));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this._c.width = size.x*dpr; this._c.height = size.y*dpr;
    this._c.style.width = size.x+'px'; this._c.style.height = size.y+'px';
    this._c.style.transition = 'opacity .12s';
    this.draw();
    this._c.style.opacity = '1';
  },
  draw(){
    if(!DATA || !this._map) return;
    const map = this._map, size = map.getSize();
    const ctx = this._c.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,this._c.width,this._c.height);

    const A = +document.getElementById('th').value;
    const B = +document.getElementById('wk').value;
    const low = document.getElementById('lowfreq').checked;
    if(B<=0) return;

    // 1px あたりのメートル数（緯度で変わる）
    const c0 = map.containerPointToLatLng([0, size.y/2]);
    const c1 = map.containerPointToLatLng([100, size.y/2]);
    const mPerPx = map.distance(c0,c1)/100;
    const dpr = this._c.width / size.x;
    // 格子はデバイスpx基準で決める。CSS px 基準にすると高DPRの端末で
    // 1セルが6〜9デバイスpxに膨らみ、輪郭がぼやけて見える。
    // 半径がセル数で大きくなりすぎると重くなるので上限側だけ粗くする。
    const RdevRaw = (B*WALK_M_PER_MIN)/mPerPx*dpr;
    const CELLdev = Math.max(2, Math.min(6, Math.ceil(RdevRaw/90)));
    const W = Math.ceil(this._c.width/CELLdev), H = Math.ceil(this._c.height/CELLdev);
    const Rc  = RdevRaw/CELLdev;                      // 徒歩圏(セル)
    if(Rc < 0.4) return;
    const mPerDev = mPerPx/dpr;
    const minPerCell = (CELLdev*mPerDev)/WALK_M_PER_MIN;  // 1セル進むのに掛かる徒歩分

    const best = new Float32Array(W*H*4).fill(Infinity);
    const margin = RdevRaw/dpr + 20;
    const Rc2 = Rc*Rc, Ri = Math.ceil(Rc);
    for(const s of DATA.stations){
      const t = low ? s.t_low : s.t_default;
      let any=false;
      for(let h=0;h<4;h++) if(t[h]!==null && t[h]<=A){any=true;break;}
      if(!any) continue;
      const p = map.latLngToContainerPoint([s.lat,s.lon]);
      if(p.x < -margin || p.y < -margin || p.x > size.x+margin || p.y > size.y+margin) continue;
      const cx = p.x*dpr/CELLdev, cy = p.y*dpr/CELLdev;
      const x0 = Math.max(0, Math.floor(cx-Ri)), x1 = Math.min(W-1, Math.ceil(cx+Ri));
      const y0 = Math.max(0, Math.floor(cy-Ri)), y1 = Math.min(H-1, Math.ceil(cy+Ri));
      for(let y=y0; y<=y1; y++){
        const dy = y+0.5-cy, dy2 = dy*dy;
        for(let x=x0; x<=x1; x++){
          const dx = x+0.5-cx, d2 = dx*dx+dy2;
          if(d2 > Rc2) continue;
          const walk = Math.sqrt(d2)*minPerCell;
          const base = (y*W+x)*4;
          for(let h=0;h<4;h++){
            const tv = t[h];
            if(tv===null || tv>A) continue;
            const v = tv + walk;
            if(v < best[base+h]) best[base+h] = v;
          }
        }
      }
    }

    // 格子解像度の ImageData を作り、平滑化を効かせて拡大する
    const img = ctx.createImageData(W,H);
    const px = img.data;
    const cols = HUBS.map(h=>HUE[h]);
    let covered = 0;
    for(let i=0;i<W*H;i++){
      let bi=-1, bv=Infinity;
      for(let h=0;h<4;h++){ const v=best[i*4+h]; if(v<bv){bv=v;bi=h;} }
      const o = i*4;
      if(bi<0){ px[o+3]=0; continue; }
      covered++;
      const c = cols[bi];
      px[o]=c[0]; px[o+1]=c[1]; px[o+2]=c[2]; px[o+3]=140;
    }
    const off = document.createElement('canvas');
    off.width=W; off.height=H;
    off.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    // ぼかしはセルの大きさに比例させる。固定値だとセルが粗いときに効かず、
    // 細かいときには効きすぎて輪郭が滲む
    ctx.filter = CELLdev > 2 ? 'blur('+(CELLdev*0.35).toFixed(1)+'px)' : 'none';
    ctx.drawImage(off, 0, 0, this._c.width, this._c.height);
    ctx.filter = 'none';
    this._covered = covered/(W*H);
  }
});
const areaLayer = new AreaLayer();

// 見た目の半径が小さいと指でもマウスでも押しにくいので、
// 同じ popup を持つ透明な当たり判定の円を上に重ねる。
// fillOpacity を 0 にすると SVG の当たり判定自体が消えるので極小値にする。
function hit(s, t, low, th, r){
  // 当たり判定も zoom に追随させるが、指で押せる下限は確保する
  L.circleMarker([s.lat,s.lon],{radius:Math.max(9, r+5), opacity:0,
    fillOpacity:0.001, fillColor:'#000'})
    .bindPopup(popup(s,t,low,th)).addTo(layer);
}

// 縮小すると点が相対的に大きくなって団子になるので、zoom に応じて縮める。
// 基準は初期表示の zoom 11。1段縮小ごとに 0.78 倍、拡大側は 1.7 倍で頭打ち。
// 拡大側は 1.0 で頭打ちにする。拡大するほど点が育つと街区が点で埋まって読めない。
const BASE_ZOOM = 11;
function zoomScale(){
  return Math.max(0.34, Math.min(1.0, Math.pow(0.80, BASE_ZOOM - map.getZoom())));
}

function render(){
  const th = +document.getElementById('th').value;
  const low = document.getElementById('lowfreq').checked;
  document.getElementById('thv').textContent = th+' 分';
  layer.clearLayers();
  const dim = cssvar('--dim'), dimbd = cssvar('--dimbd'), acc = cssvar('--acc');
  const ring = cssvar('--ring');
  const zs = zoomScale();
  let reach=0, all4=0, onlyLow=0;
  for(const s of DATA.stations){
    const t = low ? s.t_low : s.t_default;
    const set = HUBS.filter((h,i)=> t[i]!==null && t[i]<=th);
    const inOsaka = s.in_v0;
    if(set.length===0){
      if(!inOsaka) continue;
      // 既定ビューでどの枢纽にも届かない駅のうち、A層の系統が一本も無い駅は
      // 「遠い」のではなく「日中3本/h未満の線しか無い」。意味が違うので描き分ける。
      const noService = s.t_default.every(x=>x===null);
      const lowOk = s.t_low.some(x=>x!==null);
      if(!low && noService && lowOk){
        onlyLow++;
        const rr = Math.max(2.0, 3.0*zs);
        L.circleMarker([s.lat,s.lon],{radius:rr,color:acc,weight:1.6,
          fillColor:dim,fillOpacity:0.22,dashArray:'2,2'})
          .bindPopup(popup(s,t,low,th)).addTo(layer);
        hit(s, t, low, th, rr);
      }else{
        const rr = Math.max(1.4, 2.2*zs);
        L.circleMarker([s.lat,s.lon],{radius:rr,color:dimbd,weight:0.8,
          fillColor:dim,fillOpacity:0.85}).bindPopup(popup(s,t,low,th)).addTo(layer);
        hit(s, t, low, th, rr);
      }
      continue;
    }
    reach++; if(set.length===4) all4++;
    const full = set.length===4;
    const fh = fastestHub(t);
    const r = Math.max(2.0, (inOsaka ? (2.9 + set.length*0.65)
                                     : (2.2 + set.length*0.45)) * zs);
    L.circleMarker([s.lat,s.lon],{
      radius: r,
      color: full ? ring : (THEME==='light' ? '#ffffffcc' : '#00000099'),
      weight: full ? 2.2 : 1,
      fillColor: css(HUE[HUBS[fh]]), fillOpacity: inOsaka?0.95:0.55
    }).bindPopup(popup(s,t,low,th)).addTo(layer);
    hit(s, t, low, th, r);
  }
  document.getElementById('stat').innerHTML =
    `阈值内可达 <b>${reach}</b> 站 · 四枢纽全覆盖 <b>${all4}</b> 站`
    + (onlyLow ? `<br>仅低频线可达 ${onlyLow} 站` : '');
}

function popup(s,t,low,th){
  // 色は必ず CSS 変数から取る。以前ここで #fff を直書きしていたため、
  // 浅色テーマでは閾値内の分数が白背景に白文字で描かれて消えていた。
  const fg = cssvar('--popfg'), dim = cssvar('--popdim');
  let h = '<b>'+s.name+'</b>';
  if(s.ops && s.ops.length) h += ' <span style="color:'+dim+'">'+s.ops.join('/')+'</span>';
  if(!s.in_v0) h += ' <span style="color:'+dim+'">(府外缓冲)</span>';
  h += '<table style="margin-top:5px;border-collapse:collapse">';
  let mn=null;
  HUBS.forEach((hub,i)=>{
    const v=t[i];
    if(v!==null && (mn===null || v<mn)) mn=v;
    let mark='';
    if(low && s.via[i] && (s.t_default[i]===null || s.t_low[i] < s.t_default[i]-0.01)){
      mark = ' <span title="经由低频优等">⚡</span>'+(s.fare[i]?'<span title="需特急券">💴</span>':'')
           + '<span style="color:'+dim+';font-size:11px"> 経由 '+s.via[i]+'</span>';
    }
    const inTh = v!==null && v<=th;
    h += '<tr><td style="padding:1px 8px 1px 0"><span class="sw" style="display:inline-block;'
      + 'background:'+css(HUE[hub])+'"></span> '+hub+'</td>'
      + '<td style="padding:1px 8px 1px 0;color:'+(inTh?fg:dim)+';'
      + (inTh?'font-weight:700':'')+'">'
      + (v===null?'不可达':v.toFixed(1)+' 分') + '</td>'
      + '<td style="color:'+dim+';font-size:11px">'+(s.prov[i]?PROV_LABEL[s.prov[i]]:'—')
      + mark + '</td></tr>';
  });
  h += '</table><div style="margin-top:4px;color:'+fg+'">最短 '
     + (mn===null?'—':mn.toFixed(1)+' 分')+'</div>';
  if(s.t_default.every(x=>x===null) && s.t_low.some(x=>x!==null)){
    h += '<div style="margin-top:5px;color:'+dim+';font-size:11px">'
       + '日中3本/h以上の系統が無い駅。既定ビューでは不可达、⚡を入れると到達可能</div>';
  }
  return h;
}

function buildLegend(){
  const lg=document.getElementById('lg');
  lg.innerHTML='';
  const add=(sw,txt,muted)=>{
    const r=document.createElement('div'); r.className='row';
    r.innerHTML='<span class="sw" style="'+sw+'"></span><span'
      + (muted?' style="color:'+cssvar('--sub')+'"':'') + '>'+txt+'</span>';
    lg.appendChild(r);
  };
  HUBS.forEach(h=>add('background:'+css(HUE[h]), h+' 最快'));
  add('background:'+css(HUE['難波'])+';border:2.5px solid '+cssvar('--ring'),
      '粗白/黑边 = 四枢纽全覆盖');
  add('background:'+cssvar('--sub')+';width:15px;height:15px', '点越大 = 阈值内可达枢纽越多');
  add('background:'+cssvar('--dim')+';border-color:'+cssvar('--dimbd'), '阈值内不可达', 1);
  add('background:transparent;border:2px dashed '+cssvar('--acc'), '仅低频线可达 ⚡', 1);
}

fetch('reach.json').then(r=>r.json()).then(d=>{
  DATA=d;
  buildLegend();
  const cnt={measured:0,anchored:0,borrowed:0}; let tot=0;
  for(const s of d.stations) for(const p of s.prov) if(p){cnt[p]++;tot++;}
  const pct=k=>tot? (100*cnt[k]/tot).toFixed(0) : 0;
  document.getElementById('note').innerHTML =
    '<b>面覆盖</b>　打开后，每个像素格按「min over 车站（轨道时间 + 步行时间）」'
    +'对四枢纽各算一遍，取最快的那个上色，和站点用同一套逻辑，不做混色。'
    +'步行速度取 4.8km/h（80m/分）。'
    +'<b class="warn">直线半径会高估</b>：实际有大川・淀川・阪神高速・铁路本身这些屏障，'
    +'真实可步行面积大约只有圆盘的 7–8 成，靠河的车站高估更明显。要做准需要引 OSM 步行路网'
    +'跑等时圈，那是另一个量级的工作。'
    +'<br><br><b>配色</b>　每站按<b>最快到达的那个枢纽</b>着色，不做混色——红+蓝+绿平均出来是灰色，'
    +'和「不可达」的灰无法区分。可达枢纽的<b>数量</b>改用点的大小表示，'
    +'四枢纽全覆盖再加一圈粗边。'
    +'<br><br><b>精度</b>　实测 '+pct('measured')+'% ／ 锚定 '+pct('anchored')+'% ／ 借用估算 '+pct('borrowed')+'%'
    +'<br>实测=Osaka Metro 官方PDF时刻表的逐区间时分。锚定=该线该等级有实测所要时间反解速度。'
    +'借用=同等级中位数，误差可能较大。<b>无独立真值校准，误差为自我交叉验证估计。</b>'
    +'<br><br><b>虚线圈的含义</b>　这些站没有日中≥3本/h 的线，不是「远」而是「班次稀」。'
    +'難波西南侧那一片就属于这类——汐見橋線 30分毎、阪堺線恵美須町側 28分毎，'
    +'打开⚡开关即可看到它们的到达时间。'
    +'<br><br><b class="warn">优等停站型的覆盖</b>　主力 7 条线（京阪本線・南海高野線・'
    +'近鉄南大阪/大阪/奈良線・阪急宝塚本線・阪神本線）的急行/特急停站型已从各线时刻表补入'
    +'（枚方市→京橋 38→18 分、堺東→難波 22→11 分）。仍有 41/80 条线在 OSM 中只有各停停站型，'
    +'其中影响较大的是 JR宝塚線・大阪環状線快速系统，沿线站时间仍偏高估。'
    +'<br><br><b>口径不对称</b>　默认视图只用日中≥3本/h的服务型，边权不含等车时间'
    +'（视作随到随走）；低频优等图层的边额外加期望等待（发车间隔÷2）。两种口径并存是刻意设计。'
    +'<br><br><b>💴 課金</b>　标💴的可达性附带特急券／座席指定券的金钱成本，未计入时间。'
    +'<br><br>枢纽按站群定义（梅田7駅等），到达群内任一站即算到达。换乘罚时：同社3分／跨社5分／'
    +'梅田10分・難波8分・天王寺7分。';
  render();
});

const info=document.getElementById('info'), more=document.getElementById('more');
function setInfo(open){
  info.hidden = !open;
  more.textContent = open ? '图例与说明 ▴' : '图例与说明 ▾';
  localStorage.setItem('info', open?'1':'0');
}
more.addEventListener('click',()=>setInfo(info.hidden));
document.getElementById('closeInfo').addEventListener('click',()=>setInfo(false));
// 窄屏では既定で畳む。広い画面では開けておく
const saved = localStorage.getItem('info');
setInfo(saved===null ? window.innerWidth>=900 : saved==='1');

function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
  HUE = PALETTE[THEME]; GOLD = HUE.GOLD;
  document.getElementById('theme').textContent = THEME==='dark' ? '🌙 暗色' : '☀️ 浅色';
  setTiles(); redrawLines();
  if(DATA){ buildLegend(); render(); }
}
document.getElementById('theme').addEventListener('click',()=>{
  THEME = (THEME==='dark') ? 'light' : 'dark';
  localStorage.setItem('theme', THEME);
  applyTheme();
});
applyTheme();
function redrawAll(){ if(!DATA) return; render(); if(map.hasLayer(areaLayer)) areaLayer.draw(); }
document.getElementById('th').addEventListener('input',()=>{
  document.getElementById('thv').textContent =
    document.getElementById('th').value+' 分';
  redrawAll();
});
document.getElementById('wk').addEventListener('input',()=>{
  document.getElementById('wkv').textContent = document.getElementById('wk').value+' 分';
  if(map.hasLayer(areaLayer)) areaLayer.draw();
});
document.getElementById('lowfreq').addEventListener('change',redrawAll);
document.getElementById('areaOn').addEventListener('change',e=>{
  document.getElementById('walkWrap').hidden = !e.target.checked;
  if(e.target.checked) map.addLayer(areaLayer); else map.removeLayer(areaLayer);
});
// 縮尺が変わったら点の半径を引き直す
map.on('zoomend', ()=>{ if(DATA) render(); });
</script>
</body>
