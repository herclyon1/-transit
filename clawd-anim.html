<h1>Claw'd 社区动画（笔电相关）</h1>
<p>这些都是社区做的，形状和官方差 13~44%（见比对表）。你看动作是否是你要的那种。<br>
<a href="index.html">← 回首页</a></p>
<div class=g><div class=c><div class=t>clawd-tank / working-typing</div><svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="200" height="200">
  <defs>
    <style>
      /* High-speed body jitter */
      .p0_body-jitter{
        transform-origin: 7.5px 15px;
        animation: jitter 0.08s infinite alternate ease-in-out;
      }

      /* Furious typing arms (rotating out and tapping) */
      .p0_arm-l-type{
        transform-origin: 2px 10px; /* Shoulder joint */
        animation: type-l 0.15s infinite ease-in-out;
      }
      .p0_arm-r-type{
        transform-origin: 13px 10px; /* Shoulder joint */
        animation: type-r 0.12s infinite ease-in-out;
      }

      /* Eye tracking (reading lines of code quickly) */
      .p0_eyes-read{
        animation: read-code 1.2s infinite;
      }

      /* Floating data packets */
      .p0_data-bit{
        opacity: 0;
        animation: float-data 1s infinite linear;
      }
      .p0_d1{ animation-delay: 0.0s; transform-origin: -2px 10px; }
      .p0_d2{ animation-delay: 0.3s; transform-origin: 5px 12px; }
      .p0_d3{ animation-delay: 0.6s; transform-origin: 12px 11px; }
      .p0_d4{ animation-delay: 0.8s; transform-origin: 17px 9px; }
      .p0_d5{ animation-delay: 0.1s; transform-origin: 8px 10px; }
      .p0_d6{ animation-delay: 0.4s; transform-origin: 0px 11px; }
      .p0_d7{ animation-delay: 0.7s; transform-origin: 15px 12px; }

      /* Laptop Logo Glow */
      .p0_logo-glow{
        animation: logo-pulse 1.5s infinite alternate ease-in-out;
      }

      /* Keyframes */
      @keyframes jitter {
        0% { transform: translateY(0); }
        100% { transform: translateY(0.5px); }
      }

      /* Arms point forward and tap rapidly */
      @keyframes type-l {
        0% { transform: rotate(70deg); }
        25% { transform: rotate(110deg); }
        50% { transform: rotate(80deg); }
        75% { transform: rotate(100deg); }
        100% { transform: rotate(70deg); }
      }

      @keyframes type-r {
        0% { transform: rotate(-80deg); }
        25% { transform: rotate(-100deg); }
        50% { transform: rotate(-70deg); }
        75% { transform: rotate(-110deg); }
        100% { transform: rotate(-80deg); }
      }

      /* Discrete steps to look like reading text */
      @keyframes read-code {
        0%, 14% { transform: translate(-2px, 0); }
        15%, 29% { transform: translate(-1px, 0); }
        30%, 44% { transform: translate(0px, 0); }
        45%, 59% { transform: translate(1px, 0); }
        60%, 84% { transform: translate(2px, 0); }
        85%, 100% { transform: translate(-2px, 0); } /* Carriage return snap back */
      }

      /* Packets float up and fade */
      @keyframes float-data {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(-15px) scale(1.2); opacity: 0; }
      }

      @keyframes logo-pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>
    
    <!-- A small square to represent data/code -->
    <g id="p0_pixel-packet">
      <rect x="0" y="0" width="1.5" height="1.5" />
    </g>
  </defs>

  <!-- Ground Shadow -->
  <rect id="p0_ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Data Particles floating up from behind the laptop -->
  <g class="p0_data-particles" fill="#40C4FF">
    <use href="#pixel-packet" class="p0_data-bit p0_d1" x="-2" y="12" />
    <use href="#pixel-packet" class="p0_data-bit p0_d2" x="5" y="11" />
    <use href="#pixel-packet" class="p0_data-bit p0_d3" x="12" y="13" />
    <use href="#pixel-packet" class="p0_data-bit p0_d4" x="17" y="11" />
    <use href="#pixel-packet" class="p0_data-bit p0_d5" x="8" y="10" />
    <use href="#pixel-packet" class="p0_data-bit p0_d6" x="1" y="11" />
    <use href="#pixel-packet" class="p0_data-bit p0_d7" x="15" y="12" />
  </g>

  <!-- Animated Character Body -->
  <g class="p0_body-jitter">
    
    <!-- Body Base Color Group -->
    <g id="p0_body-color-group" fill="#DE886D">
      <!-- Static Legs -->
      <rect id="p0_outer-left-leg" x="3" y="13" width="1" height="2"/>
      <rect id="p0_inner-left-leg" x="5" y="13" width="1" height="2"/>
      <rect id="p0_inner-right-leg" x="9" y="13" width="1" height="2"/>
      <rect id="p0_outer-right-leg" x="11" y="13" width="1" height="2"/>

      <!-- Main Torso -->
      <rect id="p0_torso" x="2" y="6" width="11" height="7"/>
      
      <!-- Typing Arms -->
      <g class="p0_arm-l-type">
        <rect id="p0_left-arm" x="0" y="9" width="2" height="2"/>
      </g>
      <g class="p0_arm-r-type">
        <rect id="p0_right-arm" x="13" y="9" width="2" height="2"/>
      </g>
    </g>
    
    <!-- Eyes Color Group (Squinting) -->
    <g fill="#000000">
      <g class="p0_eyes-read">
        <rect id="p0_left-eye-squint" x="4" y="8.5" width="1" height="1"/>
        <rect id="p0_right-eye-squint" x="10" y="8.5" width="1" height="1"/>
      </g>
    </g>
    
  </g>

  <!-- Pixel Laptop (facing Clawd, so we see the back of the screen) -->
  <g id="p0_laptop" transform="translate(3, 9.5)">
    <!-- Laptop Base -->
    <rect x="-0.5" y="5" width="10" height="1" fill="#546E7A" rx="0.5"/>
    <!-- Screen Back -->
    <rect x="0" y="0" width="9" height="5.5" fill="#78909C" rx="0.5"/>
    <!-- Glowing Logo (Pixel) -->
    <circle cx="4.5" cy="2.5" r="1.5" fill="#40C4FF" opacity="0.2" class="p0_logo-glow"/>
    <rect x="4" y="2" width="1" height="1" fill="#FFFFFF" class="p0_logo-glow"/>
  </g>

</svg>
</div><div class=c><div class=t>clawd-tank / mini-crab-typing</div><svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 12 12" width="200" height="200">

</div><div class=c><div class=t>KebeliSamet0 / clawd-mini-typing</div><svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="200" height="200">

      .p2_breathe-anim{

      .p2_d4{ animation-delay: 0.8s; transform-origin: 17px 9px; }
      .p2_d5{ animation-delay: 0.1s; transform-origin: 8px 10px; }

      }

      @keyframes type-l {
        0%   { transform: rotate(-10deg); }

      }

      @keyframes type-r {
        0%   { transform: rotate(10deg); }

  </defs>

  <!-- No shadow (against screen edge, no ground plane) -->

      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>

</div><div class=c><div class=t>KebeliSamet0 / clawd-idle-reading</div><svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="200" height="200">
  <defs>
    <style>
      /* ═══ 14s story: arm sway → grab book → read (with thought bits) → book slides away ═══ */

      /* ── Independent ── */

      .p3_breathe{
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      .p3_blink{
        transform-origin: 7.5px 9px;
        animation: blink 5s infinite;
      }
      @keyframes blink {
        0%, 6%, 100% { transform: scaleY(1); }
        3% { transform: scaleY(0.1); }
      }

      .p3_shadow{
        transform-origin: 7.5px 15.5px;
        animation: shadow-breathe 3.2s infinite ease-in-out;
      }
      @keyframes shadow-breathe {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        50% { transform: scaleX(1.03); opacity: 0.47; }
      }

      /* ── Main 14s ── */

      /* Body: nod twice during reading */
      .p3_body-nod{
        animation: body-nod 14s infinite ease-in-out;
      }
      @keyframes body-nod {
        0%, 36%, 44%, 54%, 62%, 100% { transform: translateY(0); }
        40% { transform: translateY(0.4px); }
        58% { transform: translateY(0.4px); }
      }

      /* Left arm: BIG casual sway → reach → hold → follow book → return */
      .p3_arm-l{
        transform-origin: 2px 10px;
        animation: arm-l-anim 14s infinite ease-in-out;
      }
      @keyframes arm-l-anim {
        /* sway (big, visible fidgeting) */
        0%        { transform: translate(0, 0) rotate(0deg); }
        2.5%      { transform: translate(-0.5px, 0) rotate(25deg); }
        5%        { transform: translate(0.3px, 0) rotate(-20deg); }
        7.5%      { transform: translate(-0.5px, 0) rotate(22deg); }
        10%       { transform: translate(0, 0) rotate(0deg); }
        /* reach out left to grab book */
        18%       { transform: translate(-1px, -1px) rotate(15deg); }
        /* bring to chest (hand visible at book left edge) */
        26%       { transform: translate(2px, 0) rotate(-5deg); }
        /* hold during reading */
        76%       { transform: translate(2px, 0) rotate(-5deg); }
        /* follow book sliding down */
        84%       { transform: translate(1px, 2px) rotate(0deg); }
        /* return to normal */
        92%       { transform: translate(0, 0) rotate(0deg); }
        100%      { transform: translate(0, 0) rotate(0deg); }
      }

      /* Right arm: nudge inward during reading */
      .p3_arm-r{
        animation: arm-r-anim 14s infinite ease-in-out;
      }
      @keyframes arm-r-anim {
        0%, 22%   { transform: translate(0, 0); }
        28%, 76%  { transform: translate(-1px, 0); }
        84%, 100% { transform: translate(0, 0); }
      }

      /* Book: appear in hand → widen to chest → slide down → gone */
      .p3_book{
        opacity: 0;
        transform-origin: 7px 11.5px;
        animation: book-anim 14s infinite ease-in-out;
      }
      @keyframes book-anim {
        0%, 12%   { opacity: 0; transform: translate(-5px, -2px) scaleX(0.5); }
        18%       { opacity: 1; transform: translate(-5px, -2px) scaleX(0.5); }
        26%       { opacity: 1; transform: translate(0, 0) scaleX(1); }
        76%       { opacity: 1; transform: translate(0, 0) scaleX(1); }
        84%       { opacity: 0; transform: translate(0, 4px) scaleX(0.8); }
        100%      { opacity: 0; transform: translate(0, 4px) scaleX(0.8); }
      }

      /* Eyes: normal → slow gaze down → drift → normal */
      .p3_eyes-read{
        animation: eyes-read 14s infinite ease-in-out;
      }
      @keyframes eyes-read {
        0%, 22%   { transform: translate(0, 0); }
        30%       { transform: translate(0, 0.5px); }
        46%       { transform: translate(-0.3px, 0.5px); }
        60%       { transform: translate(0.3px, 0.5px); }
        70%       { transform: translate(0, 0.5px); }
        80%, 100% { transform: translate(0, 0); }
      }

      /* ── Thought particles (visible only during reading) ── */
      .p3_reading-fx{
        animation: reading-fx-vis 14s infinite;
      }
      @keyframes reading-fx-vis {
        0%, 27%   { opacity: 0; }
        32%, 75%  { opacity: 1; }
        78%, 100% { opacity: 0; }
      }

      .p3_thought-bit{
        opacity: 0;
        animation: float-thought 2.5s infinite linear;
      }
      .p3_t1{ animation-delay: 0s; }
      .p3_t2{ animation-delay: -0.7s; }
      .p3_t3{ animation-delay: -1.4s; }
      .p3_t4{ animation-delay: -2.1s; }

      @keyframes float-thought {
        0%   { transform: translateY(0); opacity: 0; }
        10%  { opacity: 0.6; }
        100% { transform: translateY(-12px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground shadow -->
  <rect class="p3_shadow" x="3" y="15" width="9" height="1" fill="#000"/>

  <!-- Thought particles (behind body, float up during reading) -->
  <g class="p3_reading-fx">
    <rect class="p3_thought-bit p3_t1" x="2"  y="4" width="2" height="2" fill="#40C4FF"/>
    <rect class="p3_thought-bit p3_t2" x="8"  y="3" width="1.5" height="1.5" fill="#B388FF"/>
    <rect class="p3_thought-bit p3_t3" x="12" y="5" width="2" height="2" fill="#40C4FF"/>
    <rect class="p3_thought-bit p3_t4" x="5"  y="3" width="1.5" height="1.5" fill="#69F0AE"/>
  </g>

  <!-- Nod wrapper -->
  <g class="p3_body-nod">

    <!-- ── Body layer ── -->
    <g class="p3_breathe">
      <!-- Legs (idle style) -->
      <g fill="#DE886D">
        <rect x="3" y="11" width="1" height="4"/>
        <rect x="5" y="11" width="1" height="4"/>
        <rect x="9" y="11" width="1" height="4"/>
        <rect x="11" y="11" width="1" height="4"/>
      </g>
      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- Eyes -->
      <g class="p3_eyes-read">
        <g class="p3_blink" fill="#000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>

    <!-- ── Book layer (on top of body, chest level) ── -->
    <g class="p3_breathe">
      <g class="p3_book">
        <!-- Back cover (blue) -->
        <rect x="3" y="10" width="8" height="4" fill="#4A90D9"/>
        <!-- Spine -->
        <rect x="7" y="10" width="1" height="4" fill="#2E6AB0"/>
        <!-- Page edges (top) -->
        <rect x="4" y="9.5" width="6" height="0.5" fill="#FFFDE7"/>
        <!-- Page edges (right side) -->
        <rect x="10.5" y="10.5" width="0.5" height="3" fill="#FFFDE7"/>
        <!-- Title plate -->
        <rect x="4.5" y="10.5" width="5" height="1.5" fill="#E3F2FD" opacity="0.5"/>
        <!-- Title text blocks -->

        animation: metal-glow 1s infinite;

      /* Keyframes */
      @keyframes hammer-bounce {
        0%, 100% { transform: scale(1, 1) translateY(0); } /* Base */
        30% { transform: scale(0.95, 1.05) translateY(-2px); } /* Peak raise (anticipation) */
        45% { transform: scale(1, 1) translateY(0); } /* Falling */

        70% { transform: scale(1, 1) translateY(0); } /* Recover */

        0%, 45%, 70%, 100% { transform: scale(1); opacity: 0.5; }
