<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>地図 · 学習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B2433'/%3E%3Cpath d='M6 23 12 9l7 8 3-4 4 10z' fill='%23E2A07E'/%3E%3C/svg%3E">
<!--
  「地図・学習」唯一入口。区域是切换器，不是不同页面——
  一个地图实例、一套渲染器、一份字形，切区域不重新加载页面。
  数据全部来自 OSM 原始数据：
    現代日本 47 都道府県（ISO3166-2 的 JP-01..47 直接对上 JIS 代码）+ 1741 市町村
    東亜 621 单元 / 27 国
    争议与分歧范围：填色按实际管理，官方划法另出虚线标注
  本页目前只做浏览。答题/闯关按计划在地图验收通过后重做。
-->
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#E9EDF0;
    font-family:'Noto Sans JP','Hiragino Sans','Microsoft YaHei',system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;background:rgba(255,255,255,.94);border:1px solid #C9D2DB;border-radius:9px;
    box-shadow:0 2px 10px rgba(20,30,50,.16);z-index:5}
  /* 布局原则：屏幕上同时只有「一条工具栏 + 一个底部详情条」两块常驻 UI。
     图例内容多（交通 8 条 + 地方 8 条），做成按钮收起，默认不展开，
     否则在手机上会盖掉三分之一个屏幕——上一版就是这么乱的。 */
  #top{left:8px;top:8px;right:8px;padding:7px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #seg{display:flex;gap:4px;flex:1 1 100%;min-width:0}
  #seg button{flex:1;padding:6px 0;font-size:12.5px;font-family:inherit;cursor:pointer;
    background:#EEF1F4;color:#33415C;border:1px solid #C9D2DB;border-radius:6px;
    -webkit-tap-highlight-color:transparent}
  #seg button.on{background:#1B2433;color:#fff;border-color:#1B2433;font-weight:700}
  #tools{display:flex;gap:4px;align-items:center;flex:1 1 auto;flex-wrap:wrap}
  #tools button{border:1px solid #C9D2DB;background:#fff;color:#33415C;font:inherit;font-size:11.5px;
    padding:5px 9px;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  #tools button.on{background:#1B2433;color:#fff;border-color:#1B2433}
  #tools .sep{width:1px;align-self:stretch;background:#DCE3EA;margin:1px 2px}
  #top a{font-size:12px;color:#6B7688;text-decoration:none;padding:0 2px;margin-left:auto}

  /* 底部还有一条提示/详情条，图例要落在它上面，否则最后一行会被压住 */
  #legend{left:8px;top:auto;bottom:46px;padding:8px 11px;font-size:11.5px;line-height:1.72;color:#33415C;
    max-height:calc(100% - 160px);overflow:auto;display:none;max-width:60%}
  #legend.open{display:block}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
  #legend .hr{margin:6px 0;border-top:1px dashed #C9D2DB}
  #legend .h{font-size:10.5px;letter-spacing:.1em;color:#8894A2;font-weight:700;margin-bottom:2px}

  /* 详情做成底部条：手机上从右上角弹出会跟工具栏打架，这是上一版最乱的地方 */
  #card{left:8px;right:8px;bottom:8px;padding:10px 13px;font-size:13px;display:none}
  #card .n{font-weight:800;font-size:15px}
  #card .sub{color:#6B7688;font-size:11.5px;margin-top:2px;line-height:1.5}
  #card .disp{margin-top:6px;padding-top:6px;border-top:1px dashed #c9a0a0;color:#8a3f3f;font-size:11.5px;line-height:1.45}
  #card .x{position:absolute;right:8px;top:6px;color:#9AA6B2;font-size:16px;cursor:pointer;padding:2px 6px;
    -webkit-tap-highlight-color:transparent}
  /* 图例的底边由 JS 按底部那一条（提示 or 详情）的实测高度顶上去，
     写死像素值会在详情条变高时压住图例——刚才实测就重叠了 46px。 */
  #hint{left:8px;right:8px;bottom:8px;padding:7px 11px;font-size:11.5px;color:#6B7688;text-align:center}
</style></head><body>
<div id="map"></div>
<div class="panel" id="top">
  <div id="seg">
    <button id="b-jp" class="on">現代日本</button>
    <button id="b-ea">東亜</button>
  </div>
  <div id="tools">
    <button id="b-tr">交通</button>
    <span class="sep"></span>
    <button data-b="none" class="on">なし</button>
    <button data-b="pale">地図</button>
    <button data-b="photo">写真</button>
    <button data-b="relief">標高</button>
    <span class="sep"></span>
    <button id="b-leg">凡例</button>
  </div>
  <a href="../index.html">戻る</a>
</div>
<div class="panel" id="legend"></div>
<div class="panel" id="card"></div>
<div class="panel" id="hint">点一下看详情</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
const REGIONS=["北海道","東北","関東","中部","近畿","中国","四国","九州・沖縄"];
const RC=["#8FB8D8","#9BC4A6","#E2A07E","#E8C97C","#D4899B","#A9A7D6","#8FCBC4","#E0956E"];
const RUS="#6E8CCF";   // ロシア：国家代表色 blue（Wikipedia National colours）
// ★ 用户定的规则：東亜各国的填色按**各国的代表色**。
//   色源取自**外部权威来源**：Wikipedia「National colours」——各国自己声明的国家代表色
//   （多数有法源或奥委会/体育协会依据）。条目里没有的 4 个太平洋国家/地区退回国旗主色。
//   25 国里 13 个自报「红」，所以还要一条让步规则：**冲突时国土面积小的一方**
//   先换明度、再退到它自己声明的**第二色**——这样在地图上占最大面积的国家保住第一代表色
//   （中国 = 红）。生成器 pipeline/mkpal2.py，色源解析 pipeline/natcol.py。
//   改完必须跑 pipeline/check_palette.py：52 对接壤（含隔海相望）ΔE(CIE76) 全 ≥15。
const EAC=[
 "CHN","#CF6E6E",  // 中国：国家代表色 red
 "JPN","#D69AA7",  // 日本：国家代表色 red
 "KOR","#4573C9",  // 韓国：国家代表色 red
 "PRK","#8EA2C7",  // 朝鮮：国家代表色 red
 "MNG","#6EA5CF",  // モンゴル：国家代表色 blue
 "TWN","#6B88BD",  // 台湾：国家代表色 blue
 "VNM","#CFCF6E",  // ベトナム：国家代表色 yellow
 "LAO","#C94554",  // ラオス：国家代表色 red
 "KHM","#9AAFD6",  // カンボジア：国家代表色 red
 "THA","#CF6E7E",  // タイ：国家代表色 red
 "MMR","#CFBB6E",  // ミャンマー：国家代表色 yellow
 "MYS","#C9AF45",  // マレーシア：国家代表色 gold
 "SGP","#CF6E76",  // シンガポール：国家代表色 red
 "BRN","#D6CF9A",  // ブルネイ：国家代表色 yellow
 "IDN","#C94545",  // インドネシア：国家代表色 red
 "TLS","#D69E9A",  // 東ティモール：国家代表色 red
 "PNG","#D69AA1",  // パプアニューギニア：国家代表色 red
 "PHL","#BBC6DD",  // フィリピン：国家代表色 blue
 "IND","#CF8D6E",  // インド：国家代表色 saffron
 "LKA","#9AABD6",  // スリランカ：国家代表色 blue
 "NPL","#C94562",  // ネパール：国家代表色 crimson
 "BTN","#D6AE9A",  // ブータン：国家代表色 orange
 "BGD","#CF6E79",  // バングラデシュ：国家代表色 red
 "PLW","#D6D69A",  // パラオ：条目に記載なし → 国旗主色
 "FSM","#6EA8CF",  // ミクロネシア：条目に記載なし → 国旗主色
 "MHL","#6B86BD",  // マーシャル：条目に記載なし → 国旗主色
 "MNP","#4571C9",  // 北マリアナ：条目に記載なし → 国旗主色
 "MDV","#C9455E",  // モルディブ：国家代表色 red
];

// 市区町村码 → 名。町丁那一级的「市町村」必须从**町丁自己带的 e-Stat 码**读，
// 不能拿 OSM 的市界去命中——两份数据在飞地和市界上有 607 处分歧（全量比对过），
// 用户点大阪府泉佐野市的飞地「大口新田」被标成泉南市就是这么来的。
let MUNI_NAMES={};
fetch("muni_names.json").then(r=>r.json()).then(j=>{MUNI_NAMES=j;MUNI_CODES=buildRev(j);}).catch(()=>{});
// 反查：pref|市町村名 → 该市町村名下的所有 CITY 码（政令市有多个区码）
let MUNI_CODES={};
const buildRev=j=>{const r={};
  for(const code in j){const pref=+code.slice(0,2), city=code.slice(2);
    const k=pref+"|"+j[code]; (r[k]=r[k]||[]).push([pref,city]);}
  return r;};
const muniOf=p=>{
  if(!p||p.pref==null||p.city==null) return null;
  const code=String(p.pref).padStart(2,"0")+String(p.city).padStart(3,"0");
  return MUNI_NAMES[code]||null;
};

const proto=new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles",proto.tile);
// 瓦片版本号。**重切瓦片后必须改这里**：
// pmtiles 是按字节范围取的，浏览器/CDN 把旧文件的某段范围缓存住之后，
// 新文件同名同 URL，目录偏移全对不上，取回来的就是垃圾——表现为
// 「标注还在、边界整片消失」，而且不报错。GitHub Pages 的 max-age 是 600s，
// 手机上实测能吃到更久。加个查询串就当成新资源，一次性根治。
const V="?v=20260810e";
const prefColor=["match",["get","reg"]]; REGIONS.forEach((_,i)=>prefColor.push(i,RC[i])); prefColor.push("#CCC");

const map=new maplibregl.Map({
  container:"map",attributionControl:false,maxZoom:15,dragRotate:false,pitchWithRotate:false,touchZoomRotate:true,
  style:{version:8,
    // CJK 字形：只生成了标注实际用到的 86 个码位区段（1159 个字符），
    // 不是整套中日文字库——整套要上百 MB，这样只有 10MB。
    glyphs:"glyphs/{fontstack}/{range}.pbf",
    sources:{
      jp :{type:"vector",url:"pmtiles://jp.pmtiles"+V},
      // 町丁・字等按地方拆成 4 份：整份 z14 有 225MB，超 GitHub 单文件 100MB 上限。
      // 拆开后每份 30~71MB，且不必牺牲最高层级的细节。视口只会取用到的那一份。
      choA:{type:"vector",url:"pmtiles://ka_a.pmtiles"+V},
      choB:{type:"vector",url:"pmtiles://ka_b.pmtiles"+V},
      choC:{type:"vector",url:"pmtiles://ka_c.pmtiles"+V},
      choD:{type:"vector",url:"pmtiles://ka_d.pmtiles"+V},
      // 町丁名的标注点单独一份：23 万个点，塞回 ka_* 要重切 615MB 的面数据，
      // 单独切只要 21MB，而且面数据一个字节都不用动。
      chol:{type:"vector",url:"pmtiles://cholab.pmtiles"+V},
      ea :{type:"vector",url:"pmtiles://ea_units.pmtiles"+V},
      // 底图：国土地理院タイル（官方、允许引用，日本境内覆盖最好）。
      // 只在需要时才挂上——不挂就一个瓦片都不请求。
      gsi_pale :{type:"raster",tiles:["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png"],
                 tileSize:256,maxzoom:18,attribution:"地理院タイル"},
      gsi_photo:{type:"raster",tiles:["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"],
                 tileSize:256,maxzoom:18,attribution:"地理院タイル"},
      gsi_relief:{type:"raster",tiles:["https://cyberjapandata.gsi.go.jp/xyz/relief/{z}/{x}/{y}.png"],
                 tileSize:256,maxzoom:15,attribution:"地理院タイル"},
      // 公共交通：国土数値情報（国土交通省）N02-24 鉄道 / C28-21 空港 / N09-12 定期旅客航路
      tr :{type:"vector",url:"pmtiles://transit.pmtiles"+V},
      lak:{type:"vector",url:"pmtiles://ea_lakes.pmtiles"+V},
      riv:{type:"vector",url:"pmtiles://ea_rivers.pmtiles"+V}},
    layers:[
      {id:"bg",type:"background",paint:{"background-color":"#DCEBF5"}},
      // 底图三选一，默认全关。开着的时候行政区填色会自动变半透明让底图透出来。
      {id:"base-pale",source:"gsi_pale",type:"raster",layout:{visibility:"none"},paint:{"raster-opacity":1}},
      {id:"base-photo",source:"gsi_photo",type:"raster",layout:{visibility:"none"},paint:{"raster-opacity":1}},
      {id:"base-relief",source:"gsi_relief",type:"raster",layout:{visibility:"none"},paint:{"raster-opacity":1}},

      // ── 東亜 ──
      {id:"ea-fill",source:"ea","source-layer":"units",type:"fill",layout:{visibility:"none"},
        paint:{"fill-color":["match",["get","grp"],...EAC,"#ccc"]}},
      // 東亜的 621 单元覆盖 27 个国家/地区，里头**没有日本**。日本不另做一份——
      // 两个视图共用同一套 jp-* 图层（同一份 jp.pmtiles 的 pref 层），
      // 切视图时只改 paint（填色：地方色 ↔ 日本国家代表色）和标注的 zoom 过滤。
      // 以前是 ea-jp-fill / ea-jp-line / ea-jp-sel / ea-jp-disp / ea-jp-lab / ea-jp-cap
      // 另起一套，样式各写各的，结果两个视图下的日本长得不一样（用户报的）。
      // 樺太（サハリン）と千島列島。どちらもロシア実効支配なので旗青で塗る。
      // 北方四島は disp 層で別に描いているので、ここからは差し引いてある
      //（同じ土地を二度描かない——README の赤線）。
      {id:"ea-rus",source:"jp","source-layer":"rus",type:"fill",layout:{visibility:"none"},
        paint:{"fill-color":RUS,"fill-opacity":0.9}},
      {id:"ea-rus-line",source:"jp","source-layer":"rus",type:"line",layout:{visibility:"none"},
        paint:{"line-color":"#5f5348","line-width":["interpolate",["linear"],["zoom"],2,.4,10,.9]}},
      // 樺太/千島 点了要有描边——原来只出卡片不描边，看着像没反应
      {id:"ea-rus-sel",source:"jp","source-layer":"rus",type:"line",layout:{visibility:"none"},
        filter:["==",["get","n"],"\u0000"],paint:{"line-color":"#12263A","line-width":3}},
      // 東亜的下一级（目前只做了越南 3,320 个社/坊、缅甸 121 个県）。
      // 越南 2025-07-01 撤了县级改成「省 → 社/坊」两级，所以社/坊就是它的下一级。
      // z6 起才画，再往下的层级不做——一屏几千个多边形没有意义。
      {id:"ea-sub-fill",source:"ea","source-layer":"sub",type:"fill",minzoom:6,
        layout:{visibility:"none"},paint:{"fill-color":"#fff","fill-opacity":0.001}},
      {id:"ea-sub",source:"ea","source-layer":"sub",type:"line",minzoom:6,
        layout:{visibility:"none"},
        paint:{"line-color":"#7a6f62","line-width":["interpolate",["linear"],["zoom"],6,.25,11,.8],
               "line-opacity":["interpolate",["linear"],["zoom"],6,.45,9,.85]}},
      {id:"ea-sub-sel",source:"ea","source-layer":"sub",type:"line",minzoom:6,
        layout:{visibility:"none"},filter:["==",["get","n"],"\u0000"],
        paint:{"line-color":"#1B2433","line-width":2.4}},
      {id:"ea-line",source:"ea","source-layer":"units",type:"line",layout:{visibility:"none"},
        paint:{"line-color":"#5f5348","line-width":["interpolate",["linear"],["zoom"],2,.4,10,.9]}},
      {id:"ea-sel",source:"ea","source-layer":"units",type:"line",layout:{visibility:"none"},
        filter:["==",["get","n"],"\u0000"],paint:{"line-color":"#1B2433","line-width":2.4}},
      {id:"ea-disp",source:"ea","source-layer":"disp",type:"line",layout:{visibility:"none"},
        paint:{"line-color":"#8a3f3f","line-width":1.6,"line-dasharray":[2,1.5]}},

      // ── 現代日本 ──
      {id:"jp-fill",source:"jp","source-layer":"pref",type:"fill",paint:{"fill-color":prefColor}},
      // 隐形填充层：只为命中测试。线层用 queryRenderedFeatures 只有正好点在线上才命中，
      // 这就是之前"只有最外面那层点得动"的原因。
      {id:"jp-muni-fill",source:"jp","source-layer":"muni",type:"fill",minzoom:6,
        paint:{"fill-color":"#fff","fill-opacity":0.001}},
      {id:"jp-muni",source:"jp","source-layer":"muni",type:"line",minzoom:6,maxzoom:14,
        paint:{"line-color":"#45525F","line-width":["interpolate",["linear"],["zoom"],6,.35,9,.8,12,1.2],
               // z13 起淡出：市界来自 OSM、町丁界来自 e-Stat，两者在飞地和市界处
               // 有 607 处不一致，放大后并排画就会明显错开（用户在南中樫井一带看到）。
               // 到了这一级町丁界已经全画出来，市町村范围靠选中底色表达，
               // 屏幕上只留一个来源的边界，就不会自相矛盾。
               "line-opacity":["interpolate",["linear"],["zoom"],6,.45,8,.85,12.8,.85,13.8,0]}},
      // 政令指定都市の行政区（171 个，OSM 现行版；浜松市 2024 年由 7 区并为 3 区）
      {id:"jp-ku-fill",source:"jp","source-layer":"ku",type:"fill",minzoom:8,
        paint:{"fill-color":"#fff","fill-opacity":0.001}},
      {id:"jp-ku",source:"jp","source-layer":"ku",type:"line",minzoom:8,maxzoom:14,
        paint:{"line-color":"#5A5560","line-width":["interpolate",["linear"],["zoom"],8,.4,12,1.0],
               "line-opacity":["interpolate",["linear"],["zoom"],8,.5,10,.9,12.8,.9,13.8,0],
               "line-dasharray":[3,1.5]}},
      // 町丁・字等（令和2年国勢調査 小地域，207,959 个，47 县齐全）
      // OSM 同级只有 4,462 个且缺 14 个县，不可用，故这一级不走 OSM。
      // 原始 232,009 个是「調査区」不是行政界，里面混着水面調査区，几何一直铺到海里。
      // 已按 OSM 陆地多边形整体裁剪（pipeline/clip2.py），再删 15 块港内水面残骸
      // （pipeline/water_rule.py）。对国土地理院《面積調》，1,889 个市区町村
      // ±2% 达标率 88.7% → 97.4%。
      // 再把同一市区町村里**同名的町丁合并成一个要素**（pipeline/merge_cho.py）：
      // e-Stat 是按調査区切的，一个大字人口多了就被拆成好几块，
      // 于是同一个町被内部边界切开、名字重复标好几遍（用户报的泉南市「新家」4 个）。
      // 231,677 → 207,959，面积一平方米没变。
      {id:"jp-cho-fillA",source:"choA","source-layer":"cho",type:"fill",minzoom:11,
        paint:{"fill-color":"#ffffff","fill-opacity":0.001}},
      {id:"jp-choA",source:"choA","source-layer":"cho",type:"line",minzoom:11,
        paint:{"line-color":"#6F7B89",
          "line-width":["interpolate",["linear"],["zoom"],11,0.45,14,0.9],
          "line-opacity":["interpolate",["linear"],["zoom"],11,0.55,13,0.9]}},
      {id:"jp-cho-fillB",source:"choB","source-layer":"cho",type:"fill",minzoom:11,
        paint:{"fill-color":"#ffffff","fill-opacity":0.001}},
      {id:"jp-choB",source:"choB","source-layer":"cho",type:"line",minzoom:11,
        paint:{"line-color":"#6F7B89",
          "line-width":["interpolate",["linear"],["zoom"],11,0.45,14,0.9],
          "line-opacity":["interpolate",["linear"],["zoom"],11,0.55,13,0.9]}},
      {id:"jp-cho-fillC",source:"choC","source-layer":"cho",type:"fill",minzoom:11,
        paint:{"fill-color":"#ffffff","fill-opacity":0.001}},
      {id:"jp-choC",source:"choC","source-layer":"cho",type:"line",minzoom:11,
        paint:{"line-color":"#6F7B89",
          "line-width":["interpolate",["linear"],["zoom"],11,0.45,14,0.9],

      {id:"jp-line",source:"jp","source-layer":"pref",type:"line",

      {id:"jp-selmB",source:"choB","source-layer":"cho",type:"fill",minzoom:11,

      {id:"jp-selmC",source:"choC","source-layer":"cho",type:"fill",minzoom:11,

      {id:"jp-selm",source:"jp","source-layer":"muni",type:"line",

      {id:"jp-selcA",source:"choA","source-layer":"cho",type:"line",minzoom:11,

      {id:"jp-selcB",source:"choB","source-layer":"cho",type:"line",minzoom:11,

      {id:"jp-selcC",source:"choC","source-layer":"cho",type:"line",minzoom:11,

      {id:"jp-selcD",source:"choD","source-layer":"cho",type:"line",minzoom:11,
        filter:["==",["get","n"],"\u0000"],paint:{"line-color":"#B3541E","line-width":2.2}},
      // 北方領土：之前完全空白（不在任何県的填色里），看着像海。按既定规则
      // ——填色按实际管理——单独给一个"非日本实控"的颜色，再叠虚线范围与说明。
      // 北方領土：填色按实际管理 = 俄罗斯。这里用的就是俄方色，
      // 再叠虚线范围与「日本主张…」的说明，两边立场都在图上。
      {id:"jp-disp-fill",source:"jp","source-layer":"disp",type:"fill",
        paint:{"fill-color":RUS,"fill-opacity":0.9}},
      {id:"jp-disp",source:"jp","source-layer":"disp",type:"line",
        paint:{"line-color":"#8a3f3f","line-width":1.6,"line-dasharray":[2,1.5]}},
      // 北方領土的选中描边。原来点了只出卡片、地图上一点反应都没有——
      // 因为高亮层只有 pref/muni/ku/cho 那几个，disp 层压根没配。

      {id:"jp-disp-sel",source:"jp","source-layer":"disp",type:"line",
        filter:["==",["get","dn"],"\u0000"],
        paint:{"line-color":"#12263A","line-width":3.4}},
      // 湖沼・河川。**全图只有这一份**，两个视图共用（原来東亜另有 ea-water/ea-riv 一套）。
      // 位置必须在行政区填色**之上**——图层顺序就是画顺序，挂在東亜那批里会被 jp-fill 盖掉，
      // 那正是「現代日本视图一个水体都没有」的原因：琵琶湖・霞ヶ浦・猪苗代湖 和北方領土
      // 全被県的填色压着。
      // 湖沼的填色**跟海的底色完全一样**，也不描边。
      // 用户报「川崎这块……有的涂成蓝色了，别涂色，只要是在海里的都不涂，这是设计美术问题」：
      // 港内的运河和港池在 OSM 里也是 natural=water，用一个跟海不同的蓝去填，
      // 埋立地之间就出现一格一格深浅不一的蓝块。
      // 试过按「是否落在陆地里」把海的那部分筛掉——不行，OSM 的陆地多边形
      // 把防波堤围起来的港池也算陆地，筛不出来。
      // 统一成同一个蓝就没有这个问题了：水就是水，海和湖本来也该一个颜色。
      {id:"water",source:"lak","source-layer":"water",type:"fill",minzoom:3,
        paint:{"fill-color":"#DCEBF5","fill-outline-color":"#DCEBF5"}},
      {id:"riv",source:"riv","source-layer":"rivers",type:"line",minzoom:5,

               "line-width":["interpolate",["linear"],["zoom"],5,.4,12,1.4]}},


      // ── 公共交通（默认关，按钮开）──
      // 分类是按 N02 的「鉄道区分 × 事業者種別」交叉表实测出来的，不是猜的。
      // 两处特判：大阪メトロ 法律上算「軌道」、札幌市営地下鉄 算「案内軌条式」。
      {id:"tr-ferry",source:"tr","source-layer":"ferry",type:"line",minzoom:5,layout:{visibility:"none"},
        paint:{"line-color":"#3E7CB1","line-width":["interpolate",["linear"],["zoom"],5,.5,10,1.2],
               "line-opacity":.55,"line-dasharray":[2,2]}},
      {id:"tr-rail-other",source:"tr","source-layer":"rail",type:"line",minzoom:6,layout:{visibility:"none"},
        filter:["match",["get","cls"],["tram","mono","cable","public","other"],true,false],
        paint:{"line-color":"#8D6E63","line-width":["interpolate",["linear"],["zoom"],6,.5,12,1.6]}},
      {id:"tr-rail-s3",source:"tr","source-layer":"rail",type:"line",minzoom:6,layout:{visibility:"none"},
        filter:["==",["get","cls"],"sector3"],
        paint:{"line-color":"#00838F","line-width":["interpolate",["linear"],["zoom"],6,.6,12,1.8]}},
      {id:"tr-rail-priv",source:"tr","source-layer":"rail",type:"line",minzoom:6,layout:{visibility:"none"},
        filter:["==",["get","cls"],"private"],
        paint:{"line-color":"#7B5EA7","line-width":["interpolate",["linear"],["zoom"],6,.6,12,1.9]}},
      {id:"tr-rail-sub",source:"tr","source-layer":"rail",type:"line",minzoom:8,layout:{visibility:"none"},
        filter:["==",["get","cls"],"subway"],
        paint:{"line-color":"#C2410C","line-width":["interpolate",["linear"],["zoom"],8,.8,13,2.4]}},
      {id:"tr-rail-jr",source:"tr","source-layer":"rail",type:"line",minzoom:5,layout:{visibility:"none"},
        filter:["==",["get","cls"],"jr"],
        paint:{"line-color":"#2E7D32","line-width":["interpolate",["linear"],["zoom"],5,.7,12,2.1]}},
      {id:"tr-rail-shin",source:"tr","source-layer":"rail",type:"line",minzoom:4,layout:{visibility:"none"},
        paint:{"line-color":"#0B4F8A","line-width":["interpolate",["linear"],["zoom"],4,1.1,12,3.4]},
        filter:["==",["get","cls"],"shinkansen"]},
      {id:"tr-air",source:"tr","source-layer":"air",type:"fill",minzoom:6,layout:{visibility:"none"},
        paint:{"fill-color":"#5B4B8A","fill-opacity":.75}},
      // 駅：N02 是**按线路**给的（難波 有 4 条记录），直接画就是一个站叠 4 个点。
      // 建数据时已按官方「同一駅グループコード」+ 同名 500m 近邻真合并（10,235 → 9,030），
      // 这里再按 rank（线路条数）分级：缩得越远只留换乘越多的枢纽，
      // 而不是像旧项目那样按格子随便留一个——那会把枢纽砍掉留下小站。
      // 駅の範囲：N02 的「駅」本来就是沿轨道的一小段线，这才是官方给的站范围。
      // 画成加粗短横杠，永远压在轨道上；圆点只负责标注和点击。
      {id:"tr-stationseg",source:"tr","source-layer":"stationseg",type:"line",minzoom:13,
        layout:{visibility:"none","line-cap":"round"},
        paint:{"line-color":"#1B2433","line-width":["interpolate",["linear"],["zoom"],13,3,15,7],
               "line-opacity":.85}},
      {id:"tr-station",source:"tr","source-layer":"station",type:"circle",minzoom:9,layout:{visibility:"none"},
        filter:["case",["<",["zoom"],10],[">=",["get","rank"],5],
                       ["<",["zoom"],11],[">=",["get","rank"],3],

        paint:{"circle-radius":["interpolate",["linear"],["zoom"],9,2.2,12,2.6,15,4.2],
               "circle-color":"#fff","circle-stroke-color":"#37474F",
               "circle-stroke-width":["interpolate",["linear"],["zoom"],9,1,15,1.4]}},
      // 交通标注排在行政标注前面：避让时先给駅名/空港名占位
      // ── 标注 ──
      // 一级行政区的标注点放在**它自己的県庁所在地/首府**上（pipeline/build_caps.py），
      // 不再用多边形代表点——京都府、兵庫県、新疆这种细长或形状怪的单元，
      // 代表点会落在离任何城市都很远的地方，用户实测截图里就是这个毛病。
      // 一个点画三样：上方行政区名、中间一个圆点（首府位置）、下方首府名。
      {id:"jp-cap",source:"jp","source-layer":"preflab",type:"circle",minzoom:3,
        filter:["!=",["get","cap"],""],
        paint:{"circle-radius":["interpolate",["linear"],["zoom"],4,2,9,3.6],
          "circle-color":"#243040","circle-stroke-color":"#fff","circle-stroke-width":1.1}},
      // 注意图层顺序：MapLibre 的符号避让是**从最后一个图层往前**放置的，
      // 也就是**越靠后的图层优先级越高**。所以「県庁所在地名」必须写在
      // 「都道府県名」**前面**，否则大津市的标注会先占位、把滋賀県挤掉——
      // 实测就是这个现象（用户报的「滋贺县和京都挤到一起导致无法正常显示」）。
      // 県庁所在地名：現代日本视图 z8 之后市町村名层已经把它画出来了，就收掉不重复。
      {id:"jp-caplab",source:"jp","source-layer":"preflab",type:"symbol",minzoom:4,
        filter:["!=",["get","cap"],""],
        layout:{"text-field":["get","cap"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],5,8.5,8,11],"text-optional":true,
          "text-variable-anchor":["top","right","left","bottom","top-left","top-right","bottom-left","bottom-right"],
          "text-justify":"auto","text-radial-offset":0.5,"text-padding":1},
        paint:{"text-color":"#5D6874","text-halo-color":"#fff","text-halo-width":1.3}},
      // 都道府県名。可变锚点是必须的：京都市 135.768 和大津市 135.855 只隔 8km，
      // 两个県的标注都钉在自己的首府上，固定锚点在 z8 以下必然撞车，
      // MapLibre 只会丢掉其中一个——用户看到的正是「滋賀県不见了」。
      // 给一圈候选位置，撞了就往旁边挪，而不是整个丢掉。
      // 上下界不写 maxzoom，改由 setRegion 用 filter 控：
      // 現代日本视图 z9 之后让位给市町村名，東亜视图下面没有更细的层就一直留着。
      // 必须用 filter 不能用透明度——透明度 0 的标注仍然占避让位置，会把市町村名挤掉。
      {id:"jp-lab",source:"jp","source-layer":"preflab",type:"symbol",
        layout:{"text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],4,8.5,6,11,9,15],
          "text-allow-overlap":false,"text-padding":0,"text-optional":true,
          // 8 个候选位置 + justify auto，而且**先上下、后斜角、最后才左右**。
          // 京都市 135.768 与大津市 135.855 只隔 8km：把左右排在前面，京都府会先占住
          // 右边那块，正好压在大津市头上，滋賀県就再也放不下了（实测 z7.2 就是这样）。
          // 先试上下就能把横向空间让出来。只给 4 个候选也不够，必须给满 8 个。
          "text-variable-anchor":["bottom","top","bottom-left","bottom-right","top-left","top-right","left","right"],
          "text-justify":"auto","text-radial-offset":0.55},
        paint:{"text-color":"#243040","text-halo-color":"#fff","text-halo-width":1.4}},
      // 市町村名：z8 起，z13 之后让位给町丁名
      // 県庁所在地（cap=1）画得比别的市町村重一号、颜色更深——
      // z8 之后県名收掉了，光看市名分不出哪个是県庁所在地（用户报的）。
      {id:"jp-lab-muni",source:"jp","source-layer":"munilab",type:"symbol",minzoom:8,
        layout:{"text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],8,
            ["case",["==",["get","cap"],1],11.5,9.5],12,["case",["==",["get","cap"],1],15,13]],
          "text-padding":0,
          "text-variable-anchor":["center","top","bottom"],"text-radial-offset":0.3},
        paint:{"text-color":["case",["==",["get","cap"],1],"#1B2433","#3a4654"],
          "text-halo-color":"#fff","text-halo-width":1.3,
          "text-opacity":["interpolate",["linear"],["zoom"],12.5,1,13.5,0.45]}},
      // 政令市の区名：z10 起。政令市自己的名字这时已经没有信息量了，区名才有。
      {id:"jp-lab-ku",source:"jp","source-layer":"kulab",type:"symbol",minzoom:10,
        layout:{"text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],10,10,13,13.5],"text-padding":1,
          "text-variable-anchor":["center","top","bottom"],"text-radial-offset":0.3},
        paint:{"text-color":"#4a4152","text-halo-color":"#fff","text-halo-width":1.4,
          "text-opacity":["interpolate",["linear"],["zoom"],13.5,1,14.5,0.5]}},
      // 町丁名：z13 起。23 万个点，靠 MapLibre 自己的避让决定画哪些。
      // 町丁名放在**駅名之后**，这样 MapLibre 避让时駅名先占位、町丁名让位。
      // 开交通时町丁名还要再推迟一级（z14 起），否则一屏几百个町丁名把站名淹掉——
      // 用户实测截图里就是这个样子。
      {id:"jp-lab-cho",source:"chol","source-layer":"cholab",type:"symbol",minzoom:13,
        layout:{"text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],13,9.5,15,11.5],"text-padding":3,
          "text-optional":true,"text-variable-anchor":["center","top","bottom","left","right"],
          "text-radial-offset":0.35},
        paint:{"text-color":"#5D6874","text-halo-color":"#fff","text-halo-width":1.25,
          "text-opacity":["interpolate",["linear"],["zoom"],13,0.85,14.5,1]}},
      // 争议/分歧范围的说明文字 —— 之前只有虚线看不懂，这条补上
      // 交通的标注排在町丁名**之后**：越靠后优先级越高，駅名/空港名先占位，
      // 町丁名让位。放在前面的话正好反过来，一屏几百个町丁名会把站名全淹掉。
      // 空港名必须打在**点**上，不能打在面上：面跨几个瓦片，MapLibre 就会每个瓦片
      // 各画一个标注——那覇空港横跨 3 个瓦片，于是出现三个「那覇空港」（用户报的）。
      {id:"tr-air-lab",source:"tr","source-layer":"airlab",type:"symbol",minzoom:6,layout:{visibility:"none",
          "text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],6,9.5,11,13],"text-optional":true,
          "text-variable-anchor":["top","bottom","left","right"],"text-radial-offset":0.6},
        // kind=ru 是北方領土上的三个俄方机场（OSM），也要给名字——
        // 用户报「北方領土缺失交通元素」，只画个色块不写名字等于没画。
        filter:["match",["get","kind"],["kokusai","kyoten","ru"],true,false],
        paint:{"text-color":"#3B2E5A","text-halo-color":"#fff","text-halo-width":1.5}},
      {id:"tr-station-lab",source:"tr","source-layer":"station",type:"symbol",minzoom:11,layout:{visibility:"none",
          "text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],11,9.5,15,12],
          "text-optional":true,"text-variable-anchor":["top","bottom","left","right"],"text-radial-offset":0.55},
        filter:["case",["<",["zoom"],12],[">=",["get","rank"],3],
                       ["<",["zoom"],13],[">=",["get","rank"],2],true],
        paint:{"text-color":"#26343F","text-halo-color":"#fff","text-halo-width":1.4}},
      {id:"jp-lab-disp",source:"jp","source-layer":"displab",type:"symbol",
        layout:{"text-field":["concat",["get","dn"],"\n",["get","note"]],
          "text-font":["NotoSansJP Regular"],"text-size":11,"text-max-width":11,
          "text-allow-overlap":false},
        paint:{"text-color":"#8a3f3f","text-halo-color":"#fff","text-halo-width":1.6}},

      // 東亜也一样：标注点在各单元自己的首府上，圆点 = 首府位置。
      // OSM 里没有 place 节点的 25 个单元（马绍尔的环礁、新加坡的分区等）
      // 保留原来的代表点，cap 留空——不画圆点也不写首府名，不编造。
      {id:"ea-cap",source:"ea","source-layer":"unitlab",type:"circle",minzoom:3,
        filter:["!=",["get","cap"],""],layout:{visibility:"none"},
        paint:{"circle-radius":["interpolate",["linear"],["zoom"],3,1.8,8,3.6],
          "circle-color":"#243040","circle-stroke-color":"#fff","circle-stroke-width":1.1}},
      {id:"ea-sublab",source:"ea","source-layer":"sublab",type:"symbol",minzoom:8,
        layout:{visibility:"none","text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],8,9,12,12],"text-padding":2,
          "text-optional":true,"text-max-width":9},
        paint:{"text-color":"#5b5348","text-halo-color":"#fff","text-halo-width":1.3}},
      {id:"ea-caplab",source:"ea","source-layer":"unitlab",type:"symbol",minzoom:4,
        filter:["!=",["get","cap"],""],layout:{visibility:"none",
          "text-field":["get","cap"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],4,8,8,11.5],"text-padding":1,
          "text-variable-anchor":["top","right","left","bottom","top-left","top-right","bottom-left","bottom-right"],
          "text-justify":"auto","text-radial-offset":0.45,"text-optional":true},
        paint:{"text-color":"#5D6874","text-halo-color":"#fff","text-halo-width":1.3}},
      {id:"ea-lab",source:"ea","source-layer":"unitlab",type:"symbol",layout:{visibility:"none",
          "text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],2,9,7,14],"text-padding":2,
          "text-variable-anchor":["bottom","top","bottom-left","bottom-right","top-left","top-right","left","right"],
          "text-justify":"auto","text-radial-offset":0.5,"text-optional":true},
        paint:{"text-color":"#243040","text-halo-color":"#fff","text-halo-width":1.4}},
      {id:"ea-rus-lab",source:"jp","source-layer":"ruslab",type:"symbol",layout:{visibility:"none",
          "text-field":["get","n"],"text-font":["NotoSansJP Regular"],
          "text-size":["interpolate",["linear"],["zoom"],2,9,7,14],"text-padding":2},
        paint:{"text-color":"#F4F6FA","text-halo-color":"#223C7E","text-halo-width":1.4}},
      {id:"ea-lab-disp",source:"ea","source-layer":"displab",type:"symbol",layout:{visibility:"none",
          "text-field":["concat",["get","dn"],"\n",["get","note"]],
          "text-font":["NotoSansJP Regular"],"text-size":11,"text-max-width":11},
        paint:{"text-color":"#8a3f3f","text-halo-color":"#fff","text-halo-width":1.6}}
    ]},
  center:[137.5,37.5],zoom:4.3
});
window.map=map;  // 供自动截图验收脚本使用
map.touchZoomRotate.disableRotation();
window.__map=map;

const JP=["jp-cho-fillA","jp-choA","jp-cho-fillB","jp-choB","jp-cho-fillC","jp-choC","jp-cho-fillD","jp-choD",
  "jp-muni-fill","jp-muni","jp-ku-fill","jp-ku","jp-selmA","jp-selmB","jp-selmC","jp-selmD","jp-selm","jp-selk",
  "jp-selcA","jp-selcB","jp-selcC","jp-selcD",
  "jp-lab-muni","jp-lab-ku","jp-lab-cho","jp-lab-disp"];
const EA=["ea-fill","ea-cap","ea-caplab","ea-sub-fill","ea-sub","ea-sub-sel","ea-sublab","ea-rus","ea-rus-line","ea-rus-sel","ea-rus-lab",
  "ea-line","ea-sel","ea-disp","ea-lab","ea-lab-disp"];
// 日本这几层**两个视图共用**，永远可见，只靠 setRegion 改 paint / filter。
// 以前東亜另有一整套 ea-jp-*，样式各写各的，于是两个视图下的日本长得不一样。
const JPBOTH=["jp-fill","jp-line","jp-sel","jp-disp-fill","jp-disp","jp-disp-sel",
  "water","riv","jp-cap","jp-lab","jp-caplab"];
const JPCOL=EAC[EAC.indexOf("JPN")+1];
let region="jp";

function setRegion(r){
  region=r;
  JP.forEach(id=>map.setLayoutProperty(id,"visibility",r==="jp"?"visible":"none"));
  EA.forEach(id=>map.setLayoutProperty(id,"visibility",r==="ea"?"visible":"none"));
  // 日本只有一份几何、一套图层，两个视图的差别就下面这几行。
  JPBOTH.forEach(id=>map.setLayoutProperty(id,"visibility","visible"));
  map.setPaintProperty("jp-fill","fill-color", r==="jp"?prefColor:JPCOL);
  map.setPaintProperty("jp-line","line-color", r==="jp"?"#2B3742":"#5f5348");
  map.setPaintProperty("jp-line","line-width", r==="jp"
    ?["interpolate",["linear"],["zoom"],4,.6,10,1.8]
    :["interpolate",["linear"],["zoom"],2,.4,10,.9]);
  // z8 起市町村名接手：県名和県庁所在地名同时收掉，交接干净。
  // 留到 z9 的话 z8~9 这一段两层打架，谁被挤掉全看运气——滋賀県就是这么消失的。
  map.setFilter("jp-lab",    r==="jp"?["<",["zoom"],8]:null);
  map.setFilter("jp-caplab", r==="jp"?["all",["!=",["get","cap"],""],["<",["zoom"],8]]
                                     :["!=",["get","cap"],""]);
  // 首府圆点两个视图都一直留着——放大之后光看市名分不出哪个是県庁所在地。
  map.setFilter("jp-cap",    ["!=",["get","cap"],""]);
  // 水体/河川是全東亜一份。現代日本视图只放日本的（含北方領土），
  // 否则樺太和千島的水系会在没有陆地的海面上飘着——用户报过这条。
  map.setFilter("water", r==="jp"?["==",["get","jp"],1]:null);
  map.setFilter("riv",   r==="jp"?["==",["get","jp"],1]:null);
  document.getElementById("b-jp").classList.toggle("on",r==="jp");
  document.getElementById("b-ea").classList.toggle("on",r==="ea");
  const _c=document.getElementById("card"); _c.style.display="none"; _c.classList.remove("on");
  document.body.classList.remove("carded");
  document.getElementById("hint").style.display="";
  TR.forEach(id=>map.setLayoutProperty(id,"visibility",(transit&&r==="jp")?"visible":"none"));
  document.getElementById("b-tr").style.display = r==="jp" ? "" : "none";
  drawLegend();
  map.flyTo(r==="jp"?{center:[137.5,37.5],zoom:4.3}:{center:[112,20],zoom:2.6},{duration:700});
}
// 底图切换。开着底图时把行政区填色降到半透明，否则底图完全看不见。
let base="none";
function setBase(b){
  base=b;
  ["pale","photo","relief"].forEach(x=>
    map.setLayoutProperty("base-"+x,"visibility", x===b?"visible":"none"));
  const op = b==="none" ? 1 : (b==="photo" ? 0.30 : 0.42);
  ["jp-fill","ea-fill"].forEach(id=>map.setPaintProperty(id,"fill-opacity",op));
  // 底图自带水体，我们那份就别叠了
  ["water","riv"].forEach(id=>map.setPaintProperty(id,
    id==="water"?"fill-opacity":"line-opacity",
    b==="none" ? (id==="water"?1:["interpolate",["linear"],["zoom"],5,.35,9,.9]) : 0));
  document.querySelectorAll("#tools button[data-b]").forEach(el=>el.classList.toggle("on",el.dataset.b===b));
}
document.querySelectorAll("#tools button[data-b]").forEach(el=>el.onclick=()=>setBase(el.dataset.b));

// 公共交通叠加层
const TR=["tr-ferry","tr-stationseg","tr-rail-other","tr-rail-s3","tr-rail-priv","tr-rail-sub","tr-rail-jr",
          "tr-rail-shin","tr-air","tr-station","tr-air-lab","tr-station-lab"];
let transit=false;
const TRLEG=[["#0B4F8A","新幹線"],["#2E7D32","JR在来線"],["#C2410C","地下鉄"],["#7B5EA7","民営鉄道"],
             ["#00838F","第三セクター"],["#8D6E63","軌道・モノレール・新交通"],["#5B4B8A","空港"],["#3E7CB1","定期旅客航路"]];
function setTransit(on){
  transit=on;
  // 开交通时町丁名推迟一级，避免几百个町丁名把站名淹掉
  map.setLayerZoomRange("jp-lab-cho", on?14:13, 24);
  TR.forEach(id=>map.setLayoutProperty(id,"visibility",(on&&region==="jp")?"visible":"none"));
  document.getElementById("b-tr").classList.toggle("on",on);
  if(legOpen) drawLegend();
}
document.getElementById("b-tr").onclick=()=>setTransit(!transit);

function drawLegend(){
  const el=document.getElementById("legend");
  let h="";
  if(transit&&region==="jp")
    h+="<div class='h'>公共交通</div>"+TRLEG.map(([c,n])=>`<i style="background:${c}"></i>${n}`).join("<br>")+"<div class='hr'></div>";
  h += region==="jp"
    ? "<div class='h'>地方</div>"+REGIONS.map((x,i)=>`<i style="background:${RC[i]}"></i>${x}`).join("<br>")
      +`<div class='hr'></div><i style="background:${RUS}"></i>北方領土（ロシア実効支配）`
    : "<div class='h'>凡例</div><i style='background:#8a3f3f'></i>虚线＝官方划法与实控不同";
  el.innerHTML=h;
}
let legOpen=false;
function setLegend(on){
  legOpen=on;
  document.getElementById("legend").classList.toggle("open",on);
  document.getElementById("b-leg").classList.toggle("on",on);
  if(on){ drawLegend(); fitLegend(); }
}
document.getElementById("b-leg").onclick=()=>setLegend(!legOpen);

// 底部那条（提示 or 详情）高度会变，图例的底边跟着它顶上去，别写死像素
function fitLegend(){
  const leg=document.getElementById("legend");
  const card=document.getElementById("card");
  const hint=document.getElementById("hint");
  const bot=(card.style.display!=="none"?card:hint);
  const h=bot.offsetHeight||30;
  leg.style.bottom=(h+16)+"px";
  leg.style.maxHeight="calc(100% - "+(h+16+108)+"px)";
}
new MutationObserver(fitLegend).observe(document.getElementById("card"),
  {attributes:true,childList:true,subtree:true});
window.addEventListener("resize",fitLegend);


document.getElementById("b-jp").onclick=()=>setRegion("jp");
document.getElementById("b-ea").onclick=()=>setRegion("ea");

map.on("load",()=>setRegion("jp"));

map.on("click",e=>{
  const c=document.getElementById("card");
  const fillId=region==="jp"?"jp-fill":"ea-fill";
  const selId =region==="jp"?"jp-sel" :"ea-sel";
  const dispId=region==="jp"?"jp-disp":"ea-disp";
  // 東亜视图里日本是用現代日本那份几何补上的，命中层不一样，得一起查。
  // 北方領土画在单独的 disp 层里，不在任何一个 fill 层里——原来没挂进命中层，
  // 于是点它完全没反馈（用户报的 bug）。两个视图各自的 disp 填充层都要挂上。
  const hitLayers = region==="jp" ? [fillId,"jp-disp-fill"]
                                  : [fillId,"jp-fill","ea-rus","jp-disp-fill"];
  // 東亜下一级（越南的社/坊、缅甸的県）：单独查，查到就在卡片上多写一行
  const sub = region==="ea" && map.getLayer("ea-sub-fill")
    ? map.queryRenderedFeatures(e.point,{layers:["ea-sub-fill"]})[0] : null;
  if(map.getLayer("ea-sub-sel"))
    map.setFilter("ea-sub-sel", sub?["==",["get","n"],sub.properties.n]:["==",["get","n"],"\u0000"]);
  const hit=map.queryRenderedFeatures(e.point,{layers:hitLayers})[0];
  if(!hit){ map.setFilter(selId, region==="jp"?["==",["get","code"],-1]:["==",["get","n"],"\u0000"]);
            if(region==="jp") ["jp-selm","jp-selk","jp-selmA","jp-selmB","jp-selmC","jp-selmD","jp-selcA","jp-selcB","jp-selcC","jp-selcD"].forEach(id=>map.setFilter(id,["==",["get","n"],"\u0000"]));
            else map.setFilter("jp-sel",["==",["get","code"],-1]);
            c.style.display="none"; c.classList.remove("on"); document.body.classList.remove("carded");
            document.getElementById("hint").style.display=""; return; }
  const p=hit.properties, d=map.queryRenderedFeatures(e.point,{layers:[dispId]})[0];
  if(map.getLayer("ea-rus-sel")) map.setFilter("ea-rus-sel",["==",["get","n"],"\u0000"]);
  if(map.getLayer("jp-disp-sel")) map.setFilter("jp-disp-sel",["==",["get","dn"],"\u0000"]);
  let html;
  if(p.dn){
    // 北方領土。填色按实际管理走（俄罗斯），卡片两边立场都写上。
    map.setFilter(selId, region==="jp"?["==",["get","code"],-1]:["==",["get","n"],"\u0000"]);
    if(region==="jp") ["jp-selm","jp-selk","jp-selmA","jp-selmB","jp-selmC","jp-selmD","jp-selcA","jp-selcB","jp-selcC","jp-selcD"].forEach(id=>map.setFilter(id,["==",["get","n"],"\u0000"]));
    else map.setFilter("jp-sel",["==",["get","code"],-1]);
    map.setFilter("jp-disp-sel",["==",["get","dn"],p.dn]);
    html=`<div class="n">${p.dn}</div><div class="sub">実効支配：ロシア連邦 サハリン州</div>`;
    if(p.note) html+=`<div class="disp">${p.note}</div>`;
  }else if(region==="jp"){
    map.setFilter(selId,["==",["get","code"],p.code]);
    // 命中测试一律打填充层。之前这里打的是 jp-muni（线层），
    // 只有正好点在边界线上才返回要素，所以市町村那一级几乎永远点不出来。
    const mu=map.queryRenderedFeatures(e.point,{layers:["jp-muni-fill"]})[0];
    const ku=map.queryRenderedFeatures(e.point,{layers:["jp-ku-fill"]})[0];
    const ch=map.queryRenderedFeatures(e.point,{layers:["jp-cho-fillA","jp-cho-fillB","jp-cho-fillC","jp-cho-fillD"]})[0];
    // 高亮跟着当前能看到的最细一级走，而不是永远框住整个県
    const muName = (ch&&muniOf(ch.properties)) || (mu&&mu.properties&&mu.properties.n) || null;
    // 町丁选中：只按名字过滤会把**全国同名的町丁**全点亮（用户截图里「新家」亮了三处）。
    // 必须连 pref+city 一起比。同一个市町村里同名的町丁本来就可能不连续
    //（e-Stat 按调查区切），那种是真的，应该一起亮。
    const chName = (ch&&ch.properties&&ch.properties.n) ? ch.properties.n : "\u0000";
    const chPref = ch&&ch.properties ? ch.properties.pref : null;
    const chCity = ch&&ch.properties ? ch.properties.city : null;
    const chFilter = chName==="\u0000" ? ["==",["get","n"],"\u0000"]
      : ["all",["==",["get","n"],chName],["==",["get","pref"],chPref],["==",["get","city"],chCity]];
    ["jp-selcA","jp-selcB","jp-selcC","jp-selcD"].forEach(id=>map.setFilter(id,chFilter));
    map.setFilter("jp-selk", ku ? ["==",["get","n"],ku.properties.n] : ["==",["get","n"],"\u0000"]);
    // 市町村的高亮：**用町丁自己的码去圈**，而不是拿 OSM 的市界描边。
    // 两份数据在 607 处不一致，OSM 的泉佐野市里根本不含飞地「大口新田」，
    // 拿它描边永远框不住——这不是显示 bug，是两层用了两个来源。
    // 按码集合给同一市町村的所有町丁铺一层底色，飞地自然就包进去了。
    const selPref = (ch&&ch.properties&&ch.properties.pref) != null ? ch.properties.pref
                  : (mu&&mu.properties&&mu.properties.pref);
    const codes = muName ? (MUNI_CODES[selPref+"|"+muName]||[]) : [];
    const muFilter = codes.length
      ? ["any",...codes.map(([pf,ct])=>["all",["==",["get","pref"],pf],["==",["get","city"],ct]])]
      : ["==",["get","n"],"\u0000"];
    ["jp-selmA","jp-selmB","jp-selmC","jp-selmD"].forEach(id=>map.setFilter(id,muFilter));
    // z<11 没有町丁时，退回用 OSM 市界描边
    map.setFilter("jp-selm", (muName && !ch)
      ? ["all",["==",["get","n"],muName],["==",["get","pref"],selPref]]
      : ["==",["get","n"],"\u0000"]);
    html=`<div class="n">${p.n}</div><div class="sub">県庁：${p.cap}　地方：${p.regn}</div>`;
    if(muName) html+=`<div class="sub">市町村：${muName}</div>`;
    if(ku&&ku.properties&&ku.properties.n) html+=`<div class="sub">行政区：${ku.properties.n}</div>`;
    if(ch&&ch.properties&&ch.properties.n){
      const cc=ch.properties;
      html+=`<div class="sub">町丁：${cc.n}</div>`;
      if(cc.pop) html+=`<div class="sub">人口 ${Number(cc.pop).toLocaleString()} 人 ／ ${Number(cc.hh).toLocaleString()} 世帯 <span style="opacity:.7">（令和2年）</span></div>`;
    }
    if(transit){
      const st=map.queryRenderedFeatures(e.point,{layers:["tr-station"]})[0];
      if(st&&st.properties&&st.properties.n)
        html+=`<div class="sub">駅：${st.properties.n}　<span style="opacity:.75">${st.properties.ln||""}</span></div>`;
      const ap=map.queryRenderedFeatures(e.point,{layers:["tr-air"]})[0];
      if(ap&&ap.properties&&ap.properties.n) html+=`<div class="sub">空港：${ap.properties.n}</div>`;
    }
    const dd=map.queryRenderedFeatures(e.point,{layers:["jp-disp-fill"]})[0];
    if(dd&&dd.properties&&dd.properties.dn)
      html+=`<div class="sub" style="color:#8a3f3f">${dd.properties.dn}：${dd.properties.note}</div>`;
  }else if(p.de_facto==="RUS"){
    map.setFilter(selId,["==",["get","n"],"\u0000"]);
    map.setFilter("jp-sel",["==",["get","code"],-1]);
    map.setFilter("ea-rus-sel",["==",["get","n"],p.n]);
    html=`<div class="n">${p.n}</div><div class="sub">ロシア連邦 サハリン州（州都：ユジノサハリンスク）</div>`;
    if(p.note) html+=`<div class="sub">${p.note}</div>`;
  }else if(p.grp!==undefined){
    map.setFilter(selId,["==",["get","n"],p.n]);
    map.setFilter("jp-sel",["==",["get","code"],-1]);
    html=`<div class="n">${p.n}</div><div class="sub">${p.grp}</div>`;
    if(p.cap) html+=`<div class="sub">首府：${p.cap}</div>`;
    if(sub&&sub.properties&&sub.properties.n) html+=`<div class="sub">下位区画：${sub.properties.n}</div>`;
  }else{
    // 命中的是東亜视图里的日本（属性来自 pref 层，没有 grp）
    map.setFilter(selId,["==",["get","n"],"\u0000"]);
    map.setFilter("jp-sel",["==",["get","code"],p.code]);
    html=`<div class="n">${p.n}</div><div class="sub">日本　県庁：${p.cap}　地方：${p.regn}</div>`;
  }
  if(!p.dn && d&&d.properties&&d.properties.note)
    html+=`<div class="disp">${d.properties.dn}：${d.properties.note}</div>`;
  c.innerHTML='<span class="x" onclick="document.getElementById(\'card\').style.display=\'none\';document.getElementById(\'card\').classList.remove(\'on\');document.getElementById(\'hint\').style.display=\'\';">×</span>'+html;
  c.style.display="block"; c.classList.add("on");
  document.body.classList.add("carded");
  document.getElementById("hint").style.display="none";
});
</script></body></html>
