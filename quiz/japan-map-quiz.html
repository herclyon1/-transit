<!DOCTYPE html>
<!--
========== 维护者说明（用户重新上传本文件时必读；外部SKILL.md不跨会话持久，以本注释为准） ==========
自包含单页应用：日本47县地理测验 + 大日本/共荣圈历史版图浏览。
架构：D3 v7 + topojson-client（cdnjs）。县界=smartnews s0010市町村级运行时合并。
历史版图数据=NE 10m admin1嵌入（ADMIN1常量：25国654单元，k=共荣圈归属，d已弃用）
+ EXTRA_TERR（樺太=50°N切割、関東州=辽宁海岸线按普兰店湾—貔子窝租借界切割含长山群岛、
千島=18岛；球面winding=平面CW，改动后必须d3.geoArea<0.05校验）。
大日本=歴史一级行政区：DAI_UNITS运行时topojson.merge现代单元（朝鲜十三道/台湾五州三庁/
南洋庁六支庁），京畿道・黄海道因开城归属用DAI_PRECOMP预计算几何（4位小数，与NE共享顶点，
勿改精度否则道界出细缝）；金门非日领已从台湾组剔除（kyoeiken中k=3占领区）。
東亜(原共荣圈,内部mode键仍为kyoeiken勿改)=去历史化：一级行政区全保留(625单元)按国家组
KYO_COLORS上色(国界轮廓层已废,见文末gWorldOut弃用条)；日本组JP_GROUP={JPN}(仅现日本,
v17起JP_IDEAL_CN与历史叠加均已移除)；樺太/千島=俄单元,金门随台湾；
新嵌NPL/BTN/BGD(NE admin0简化0.008)。勾选过滤按grp(kyoHidden,日本锁定)。
関東州北界=条约直线基线(续订旅大租地条约"亚当湾北岸至貔子窝湾北尽处"，1898.11勘界
微调无GIS数据)——勿再改折线，直线即史实。
定位标记gMk默认开(mkOn,v18起)；海域范围gSea=九段线式虚线闭合区(SEA_ZONES,d3.geoCircle近似
200海里主张海域+南洋委任统治框),独立开关seaOn(默认开,面板"海域"钮+浏览"远岛海域"复选框同步)，
点击区域直达缩放。高精度小岛层gIsl=OSM实测海岸线(HI_ISL:冲鸟礁盘环/南鸟/竹岛独岛/尖阁鱼钓,
~10KB,5位小数,全模式常驻按模式配色,竹岛browse为中性灰;NE/s0010无此四岛故为独立叠加层)。
東亜v18=现代实控版图:日本=NE现日本(白)；台湾TWN独立涂色(台湾口径,含金门)；库页/千岛
=RUS俄罗斯单元(不是删除!)；尼不孟已细分(KYO_SUB,v21起为现行区划)；KYO_COLORS国家代表色。
東亜v25起大陆层=geoBoundaries CGAZ现行区划(CC-BY 4.0, geoboundaries.org)外置三档LOD:
ea_t0/t1/t2.topojson = 1500m/300m/80m简化(内含units,disp,water,rivers四个图层)。
v27渲染契约(改动前必读):
 ①分档必须全局统一(EA_TIERS阈值 k≤5→t0, ≤30→t1, 其余t2)。绝不可"按单元混档"——
   相邻单元取不同档=两侧顶点不一致=又出"各画各的线"。v25/v26的eaRefine混档已废除。
 ②東亜重图层全部画在 <canvas id="eaCv"> 上(见eaDrawNow),SVG侧只留标签/标记/海域/高精度岛。
   単元不再是DOM节点,点击走 eaHitTest(bbox预筛+d3.geoContains)。
 ③几何预烘焙为 Path2D 缓存(eaP2D),平移缩放只改画布变换矩阵,帧内零几何遍历。
   换档或换投影(fitExtent/resize)后必须调 eaInvalidate() 清缓存,否则地图停在旧投影。
 ④性能基线(4x降速手机模拟,390x844): 首屏<2.1s, k=30拖动帧p50≈25ms。改完请用
   scratchpad/mobileperf.js 复测,超过33ms即为回归。
ADMIN1(3.37MB)已外置admin1.topojson,仅大日本模式懒加载;MNP已并入ea数据。
KYO_SUB/KYO_FIX/VN34/KYO_DROP(v26删)与gLandBg/gWorldBg/gHalo(v27删)均为自建数据时代的
补缝遗产,勿再引入。湖泊河流已裁剪到本图陆地范围,国界外不显示。
海域JP_SEA=等距中线buffer法(领土3.33°缓冲−邻国1.67°缓冲,本方海岸0.3°保护带防切陆,
含陆block不受面积滤除;重算需跑zone()流程并验证:圈外陆地=0且边界穿陆=0)。
标记mkOn默认开=三层:ISLAND_MARKS各国小岛名(虚线圈,点击直达)+東亜小国国家级(最大单元
<16px)+dai小单元;南洋伪标记已废。東亜单元描边#5f5348/.45(深底可见)。
v19: JP_SEA改存边界线MultiLineString(非多边形):zone多边形→boundary−邻国陆地0.12°缓冲
(接壤段不画线);洞环仅保留围邻国陆地者(歯舞色丹类);验收指标=线穿本方陆/穿邻国陆双零。
DAI_CTX=大日本接壤外国陆地白色剪影(中国+北桦太+滨海边疆,gCtx层,fill #f4f1ea无标注)。
HI_ISL九组(新增硫黄/大东/小笠原/西沙[缺永乐,Overpass超时]/南沙),HI_META逐模式配色:
西沙東亜=中国色(实控),南沙=中性灰(实控拼图),二者dai=台湾総督府色(1939新南群島编入高雄州)。
名称标签全局化:histLblFeats+updateLabels双轨,缩放自适应显隐同浏览;切回浏览rebindPrefLabels。
gWorldOut已弃用勿再启用。
浏览点击=gHl .hl.sel选中描边反馈(触屏无hover的替代)。点海面=clearSelection()+popZoom()逐级退栈(栈空不动)。
v23四修+一撤:①cleanGeom(MIN=2.2e-6sqdeg)清退化外环/微洞,应用于buildDai/buildKyo全ADMIN1派生单元(残留8环
=西沙6个4顶点岛/島根香川小岛,真岛保护性保留);比哈尔单环492顶点零自相交,证内部无杂线。②白缝根治=各国融合背景
gWorldBg:每国一个path(MultiPolygon单次填充→内部零AA缝),ADMIN1国topojson.merge融合,KYO_SUB(尼不孟)省份共享顶点
拼接为一个MultiPolygon,同色缩放描边(.7)+crispEdges桥接国界缝;垫在gWorld下,前景任何相邻路径AA发丝缝透出同色背景
→隐形(手机Chrome各SVG路径独立抗锯齿,共享边渗背景色=尼泊尔"白缝"真因,非几何缝)。dai/browse隐藏bg。③退栈zoomStack:
pushZoom在所有程序化缩放前记录当前transform;zoom加start/end手势监听(e.sourceEvent非空即用户手势),手势结束把pre-gesture
transform入栈→浏览手动pinch也可退回;zoomToRegion/hiFocus/zoomToPacific/marker均入栈;popZoom栈空=不动(不再回全图);
setViewJapan/enterHist/zoomToRegion(null)调resetZoomStack。④拉克沙群岛等挂接単元小岛(meta.unit)点击=pushZoom+
zoomToHistFeat(単元外接框)+showHistInfo(不再固定k=400缩到空海)。⑤蓝描边软化(#3d6f9c/1.3-1.5/opacity)+信息卡✕
(MutationObserver常驻,clearSelection去描边关卡但不动缩放)。【已撤销:v23曾试浏览高精度懒加载niiyz全分辨率,因.hires
stroke:none连县轮廓一起消失+8万~48万顶点手机每帧重绘巨卡,弊远大于利,全数移除;s0010(冲绳2084顶点)是smartnews源
上限,即浏览基底,真正全岛竹岛级需polygon union库/客户端并集(未加载)不可行,勿再尝试整县高精度。】
面板lg-jmp：dai=関東州/南洋庁(组级zoomToPacific)/全図/标记钮；kyo=南洋群島/全図/标记钮。
已知陷阱：①world-atlas各精度层id前导零不一致，按id匹配必须数值归一化；
②新西兰查塔姆群岛跨反经线，历史视图必须projection.rotate([-150,0])；
③東京都南鳥島/沖ノ鳥島会撑爆取景，日本视图fit必须用mainFC（各县主体多边形）；
④相邻多边形描边互相覆盖，高亮描边一律画在独立overlay层（gHl/.wsel+raise）。
测验机制：题目二元组"id:n/id:c"（混合=86题）；错题6-12题重考+18-30确认考两段式；
县名厅双清才标绿；roundMiss本轮/localStorage jpq_miss历史双口径；切scope/qtype/模式(有进度)需confirm；
"不会"按钮走错题流程直接亮答案。答对亦locked(900ms)防连点竞态；dblclick.zoom已禁用。
⑤标签中心/可见性一律用mainFC主体多边形（東京被小笠原、鹿児島被奄美拖偏过）；
⑥TOPO_URL锁commit(b403e71)勿改回@main；日本视图zoom上限200、历史视图600（v15提升）。
修改流程：增量修改→更新本注释与文末CHANGELOG→jsdom交互测试（需polyfill
SVGSVGElement width/height.baseVal与window.fetch，压缩setTimeout）通过后交付。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本都道府県 地図クイズ</title>
<style>
  :root{
    --bg:#f7f5f0; --panel:#ffffff; --ink:#2c2c2a; --ink2:#6b6a64; --line:#dcd9d0;
    --ok:#2e7d4f; --ng:#b3372f; --sea:#dcebf5; --accent:#1d5a8a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;}

  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5;}
  header h1{font-size:15px;font-weight:600;letter-spacing:.05em;margin-right:6px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:transparent;padding:6px 14px;font-size:13px;color:var(--ink2);cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;}
  select{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  #labelToggle,#seaToggle{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;}
  #stats{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap;}

  #promptBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 22px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);text-align:center;max-width:92vw;}
  #promptBar .q{font-size:22px;font-weight:700;letter-spacing:.06em;}
  #promptBar .fb{font-size:13px;margin-top:3px;min-height:17px;}
  .fb.good{color:var(--ok);} .fb.bad{color:var(--ng);}

  #stage{position:relative;flex:1;background:var(--sea);overflow:hidden;}
  #eaCv{position:absolute;z-index:0;display:none;pointer-events:none;transform-origin:0 0;}
  svg#map{position:relative;z-index:1;} /* 必须: 否则绝对定位的画布按CSS绘制顺序盖在静态定位的SVG上 */
  svg{width:100%;height:100%;display:block;touch-action:none;}
  .pref{stroke:#8f9aa5;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:filter .15s;}
  @media (hover:hover){ .pref:hover{filter:brightness(.93);} }
  .pref.flashOk{fill:#8fd6a8 !important;}
  .pref.flashNg{fill:#f0a49e !important;}
  .pref.reveal{fill:#ffe08a !important;}
  .hl{fill:none;pointer-events:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;}
  .hl.ok{stroke:#2e7d4f;stroke-width:1.6;}
  .hl.bad{stroke:#b3372f;stroke-width:2;}
  .wc.wsel{stroke:#3d6f9c;stroke-width:1.3;stroke-opacity:.85;}
  .lbl{font-size:13px;fill:#41413e;pointer-events:none;text-anchor:middle;paint-order:stroke;
    stroke:#ffffff;stroke-width:2;stroke-linejoin:round;}

  #jumps{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:4;}
  #jumps button{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  #jumps button:active{transform:scale(.96);}

  #info{position:absolute;right:12px;bottom:12px;z-index:4;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:10px 24px 10px 14px;font-size:13px;
    max-width:240px;box-shadow:0 1px 6px rgba(0,0,0,.06);display:none;}
  #info .n{font-size:16px;font-weight:700;}
  #info .c{color:var(--accent);margin-top:2px;}
  #info .r{color:var(--ink2);margin-top:2px;}
  #info .x{position:absolute;top:3px;right:7px;width:20px;height:20px;display:flex;align-items:center;
    justify-content:center;font-size:15px;line-height:1;color:var(--ink2);cursor:pointer;border-radius:6px;}
  #info .x:active{background:var(--line);}

  #legend{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;
    line-height:1.8;box-shadow:0 1px 6px rgba(0,0,0,.06);display:none;}
  #legend .lg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  #legend .lg-head b{font-size:13px;}
  #legend .lg-sel{color:var(--accent);flex:1;min-width:120px;}
  #legend .lg-toggle{margin-left:auto;font-size:12px;padding:4px 10px;border:1px solid var(--line);
    border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;}
  #legend .lg-body{display:none;margin-top:6px;max-height:36vh;overflow:auto;}
  #legend.open .lg-body{display:block;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--ink2);z-index:6;background:var(--sea);}
  #doneCard{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;}
  #doneCard .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:26px 34px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.1);}
  #doneCard .big{font-size:22px;font-weight:700;margin-bottom:8px;}
  #doneCard .sub{font-size:13px;color:var(--ink2);line-height:1.7;}
  #doneCard button{margin-top:14px;font-size:14px;padding:8px 20px;border:none;border-radius:8px;
    background:var(--accent);color:#fff;cursor:pointer;}

  @media (max-width:640px){
    header{padding:8px 10px;gap:8px;}
    header h1{display:none;}
    #promptBar .q{font-size:18px;}
    #stats{font-size:12px;}
  }
  .hl.sel{fill:none;stroke:#3d6f9c;stroke-width:1.5;stroke-opacity:.9;vector-effect:non-scaling-stroke;pointer-events:none;}
  .seac{fill:rgba(255,255,255,.15);stroke:#7a8ca0;stroke-width:1.2;stroke-dasharray:4 3;}
  .seaz{fill:none;stroke:#7a8ca0;stroke-width:1.1;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;pointer-events:none;}
  .seat{font-size:10px;fill:#5a6b7d;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:2.2;pointer-events:none;}
  .wout{fill:none;stroke:#6b5d52;stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none;}
  .mkc{fill:rgba(255,255,255,.25);stroke:var(--accent);stroke-width:1.5;}
  .islhl{fill:none;stroke:#3d6f9c;stroke-width:1.3;stroke-opacity:.85;vector-effect:non-scaling-stroke;pointer-events:none;}
  .mkt{font-size:11px;fill:var(--accent);paint-order:stroke;stroke:#fff;stroke-width:2.5;
    text-anchor:middle;pointer-events:none;font-weight:600;}
  .lg-jmp{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;
    background:transparent;color:var(--accent);cursor:pointer;margin-left:4px;}
  @media (max-width:640px){ #legend .lg-sel{display:none;} }
  @media (prefers-reduced-motion:reduce){
    .pref{transition:none;}
  }
</style>
</head>
<body>
<header>
  <h1>日本都道府県クイズ</h1>
  <div class="seg" id="modeSeg">
    <button data-m="browse" class="on">浏览</button>
    <button data-m="campaign">闯关</button>

    <button data-j="r6">四国</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>

function mainFeature(f){
  if(f.geometry.type !== "MultiPolygon") return f;
  const ringArea = r => { let t=0; for(let i=0,j=r.length-1;i<r.length;j=i++){ t += (r[j][0]+r[i][0])*(r[j][1]-r[i][1]); } return Math.abs(t); };
  let best=null, ba=-1;
  for(const poly of f.geometry.coordinates){ const ar=ringArea(poly[0]); if(ar>ba){ba=ar; best=poly;} }
  return {type:"Feature", properties:f.properties, geometry:{type:"Polygon", coordinates:best}};
}

var zoomStack = [];
// v27.2: 栈项区分来源。byClick=点击小岛/单元/面板跳转造成的缩放, 才允许"点空白退回";
// 手动手势缩放只作为历史记录, 不会被空白点击无脑退掉(用户: "直接点击空白处无脑回退"是缺陷)。
function pushZoom(byClick){
  if(!svg) return;
  var t = d3.zoomTransform(svg.node());
  var last = zoomStack[zoomStack.length-1];
  if(last && Math.abs(last.t.k-t.k)<1e-3 && Math.abs(last.t.x-t.x)<0.5 && Math.abs(last.t.y-t.y)<0.5){
    last.byClick = last.byClick || byClick !== false; return; }
  zoomStack.push({t:t, byClick: byClick !== false});
  if(zoomStack.length>40) zoomStack.shift();
}
function canPopZoom(){ var e=zoomStack[zoomStack.length-1]; return !!(e && e.byClick); }
function popZoom(){
  if(!canPopZoom()) return;   // 顶层不是点击跳转 => 空白点击只清选中, 不动视角
  var e = zoomStack.pop();
  svg.transition().duration(500).call(zoom.transform, e.t);
}
function resetZoomStack(){ zoomStack = []; window.__gestT = null; }
function cleanGeom(geom){
  if(!geom) return geom;
  var MIN = 2.2e-6;
  function ringArea(r){ var a=0; for(var i=0;i<r.length-1;i++){ a += r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1]; } return Math.abs(a)/2; }
  function cleanPoly(rings){
    if(!rings || !rings.length) return null;
    if(ringArea(rings[0]) < MIN) return null;
    var out=[rings[0]];
    for(var i=1;i<rings.length;i++){ if(ringArea(rings[i])>=MIN) out.push(rings[i]); }
    return out;
  }
  if(geom.type==="Polygon"){ var p=cleanPoly(geom.coordinates); return p?{type:"Polygon",coordinates:p}:geom; }
  if(geom.type==="MultiPolygon"){ var polys=geom.coordinates.map(cleanPoly).filter(Boolean); return polys.length?{type:"MultiPolygon",coordinates:polys}:geom; }
  return geom;
}
function fixWinding(geom){ // v24:球面绕向校正——环绕向反=d3球面填充"全球补集"(海变国色的真因);逐Polygon验geoArea>2π则反转全部环
  if(!geom) return geom;
  const polys = geom.type==="MultiPolygon" ? geom.coordinates : [geom.coordinates];
  const out = polys.map(p => {
    let q = p;
    if(d3.geoArea({type:"Polygon", coordinates:q}) > Math.PI*2) q = q.map(r => r.slice().reverse());
    if(d3.geoArea({type:"Polygon", coordinates:q}) > Math.PI*2) return null; // 反转仍超半球=退化环,弃
    return q;
  }).filter(Boolean);
  return {type:"MultiPolygon", coordinates: out};
}
function dissolveRings(rings){ // 无向边计数融合共享顶点的密铺环→并集边界环(消内部边=消省间AA缝)
  var P=6, vk=function(p){return p[0].toFixed(P)+","+p[1].toFixed(P);};
  var ek=function(a,b){var ka=vk(a),kb=vk(b);return ka<kb?ka+"#"+kb:kb+"#"+ka;};
  var cnt=new Map(), pts=new Map();
  rings.forEach(function(r){for(var i=0;i<r.length-1;i++){var a=r[i],b=r[i+1],k=ek(a,b);cnt.set(k,(cnt.get(k)||0)+1);pts.set(vk(a),a);pts.set(vk(b),b);}});
  var adj=new Map();
  cnt.forEach(function(c,k){ if(c===1){ var kk=k.split("#"),ka=kk[0],kb=kk[1];
    if(!adj.has(ka))adj.set(ka,[]); if(!adj.has(kb))adj.set(kb,[]); adj.get(ka).push(kb); adj.get(kb).push(ka); }});
  var usedE=new Set(), out=[], EK=function(a,b){return a<b?a+"#"+b:b+"#"+a;};
  adj.forEach(function(_,start){
    adj.get(start).forEach(function(first){
      if(usedE.has(EK(start,first))) return;
      var prev=start, cur=first; usedE.add(EK(start,first));
      var ring=[pts.get(start),pts.get(cur)], guard=0;
      while(guard++<200000){
        var ns=adj.get(cur)||[], nxt=null, n;
        for(var i=0;i<ns.length;i++){ n=ns[i]; if(n!==prev && !usedE.has(EK(cur,n))){ nxt=n; break; } }
        if(nxt===null){ for(var j=0;j<ns.length;j++){ n=ns[j]; if(!usedE.has(EK(cur,n))){ nxt=n; break; } } }
        if(nxt===null) break;
        usedE.add(EK(cur,nxt)); ring.push(pts.get(nxt)); prev=cur; cur=nxt;
        if(cur===start) break;
      }
      if(ring.length>3) out.push(ring);
    });
  });
  return out;
}
function dissolvedGeom(rings){ // 融合并只保留显著环(丢弃链接产生的碎屑小环)
  var dis=dissolveRings(rings); if(!dis.length) return null;
  var area=function(r){var a=0;for(var i=0;i<r.length-1;i++)a+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];return Math.abs(a)/2;};
  var mx=0; dis.forEach(function(r){var a=area(r); if(a>mx)mx=a;});
  var keep=dis.filter(function(r){return area(r)>=mx*0.02;});
  return {type:"MultiPolygon", coordinates: keep.map(function(r){return [r];})};
}

  $("info").style.display = "none";
  $("doneCard").style.display = "none";
  $("startBtn").style.display = "none";
  $("idk").style.display = "none";
  studyRegion = null;

  $("scope").disabled = (m === "campaign" || m === "dainippon" || m === "kyoeiken");
  $("qtype").disabled = (m === "dainippon" || m === "kyoeiken");

  if(m === "quiz"){
    queue = shuffle(buildItems(scopeIds()));
    buildPend(queue);

    next();
  }else if(m === "campaign"){
    stageIdx = 0; reviewPool = []; misses = 0; req = {}; roundMiss = {};

    $("promptBar").style.display = "none";

function onClick(d){
  const id = d.properties.id;
  if(mode === "browse" || (mode === "campaign" && phase === "study")){
    const info = $("info");
    info.style.display = "block";
    info.innerHTML = `<div class="n">${P[id][0]}</div><div class="c">县厅：${P[id][1]}</div><div class="r">地方：${REGIONS[P[id][2]]}</div>`;
    gHl.selectAll("path.sel").remove(); // 点击反馈：选中县描边（v12起触屏无hover反馈的替代）
    gHl.append("path").datum(d).attr("class","hl sel").attr("d", path(d));
    return;
  }
  if(cur === null || locked) return;
  const cid = itemId(cur);
  const sel = gMap.selectAll("path").filter(f => f.properties.id === id);
  const feat = features.find(f => f.properties.id === cid);
  if(id === cid){
    queue.shift();
    sel.classed("flashOk", true);
    setTimeout(() => sel.classed("flashOk", false), 600);
    if((req[cur]||1) > 1){
      req[cur]--;
      const pos = Math.min(queue.length, 18 + Math.floor(Math.random()*13));
      queue.splice(pos, 0, cur);
      $("fb").textContent = `对。${P[cid][0]} → 县厅 ${P[cid][1]}。这题之前错过，稍后还要确认一次。`;
    }else{
      done++;
      pend[cid]--;
      if(pend[cid] <= 0 && gHl.selectAll(".hl.ok").filter(f => f.properties.id === cid).empty())
        gHl.append("path").datum(feat).attr("class","hl ok").attr("d", path(feat));
      $("fb").textContent = `对。${P[cid][0]} → 县厅 ${P[cid][1]}`;
    }
    $("fb").className = "fb good";
    locked = true; // 900ms反馈期内锁输入：否则重复点击会误吞队列项并重复计数
    setTimeout(next, 900);
  }else{
    misses++;
    roundMiss[cid] = (roundMiss[cid]||0) + 1;
    req[cur] = 2;
    const m = loadMiss(); m[cid] = (m[cid]||0) + 1; saveMiss(m);
    locked = true;
    sel.classed("flashNg", true);
    const correctSel = gMap.selectAll("path").filter(f => f.properties.id === cid);
    correctSel.classed("reveal", true);
    const tmp = gHl.append("path").datum(feat).attr("class","hl bad").attr("d", path(feat));
    $("fb").textContent = `不对，你点的是 ${P[id][0]}。${P[cid][0]} 是亮黄色那个，看清位置——稍后重考。`;
    $("fb").className = "fb bad";
    const item = queue.shift();
    const pos = Math.min(queue.length, 6 + Math.floor(Math.random()*7));
    queue.splice(pos, 0, item);
    setTimeout(() => {
      sel.classed("flashNg", false);
      correctSel.classed("reveal", false);
      tmp.remove();
      next();
    }, 1800);
  }
}
$("idk").onclick = () => {
  // "不会"＝按错题处理但直接亮答案：比瞎点更快进入重考流程，且不污染"点错成谁"的反馈
  if(cur === null || locked) return;
  if(!(mode === "quiz" || (mode === "campaign" && (phase === "stagequiz" || phase === "review")))) return;
  const cid = itemId(cur);
  const feat = features.find(f => f.properties.id === cid);
  misses++;
  roundMiss[cid] = (roundMiss[cid]||0) + 1;
  req[cur] = 2;
  const m = loadMiss(); m[cid] = (m[cid]||0) + 1; saveMiss(m);
  locked = true;
  const correctSel = gMap.selectAll("path").filter(f => f.properties.id === cid);
  correctSel.classed("reveal", true);
  const tmp = gHl.append("path").datum(feat).attr("class","hl bad").attr("d", path(feat));
  $("fb").textContent = `${P[cid][0]}（${REGIONS[P[cid][2]]}）是亮黄色那个，看清位置——稍后重考。`;
  $("fb").className = "fb bad";
  const item = queue.shift();
  const pos = Math.min(queue.length, 6 + Math.floor(Math.random()*7));
  queue.splice(pos, 0, item);
  setTimeout(() => { correctSel.classed("reveal", false); tmp.remove(); next(); }, 1800);
};
function finish(){
  cur = null;
  $("idk").style.display = "none";
  if(mode === "campaign"){
    if(phase === "stagequiz"){
      const prev = reviewPool.slice();
      reviewPool = reviewPool.concat(stageCounties());
      if(prev.length > 0) beginReview(prev);
      else advanceStage();
    }else{
      advanceStage();
    }
    return;
  }
  const m = loadMiss();
  const roundList = Object.keys(roundMiss).sort((a,b) => roundMiss[b]-roundMiss[a])
    .map(i => `${P[i][0]}×${roundMiss[i]}`).join("、");
  const worst = scopeIds().filter(i => m[i]).sort((a,b) => m[b]-m[a]).slice(0,5)
    .map(i => `${P[i][0]}×${m[i]}`).join("、");
  showCard("本轮清零",
    `${total} 个全部定位完成，本轮失误 ${misses} 次。<br>` +
    (roundList ? `本轮错过：${roundList}<br>` : `本轮零失误。<br>`) +
    (worst ? `历史累计易错（含以往所有轮次）：${worst}　<a href="#" id="resetMiss" style="color:var(--ng);">清零历史统计</a><br>` : "") +
    `按遗忘曲线：明天、第3天、第7天再各清零一轮。`,
    "再来一轮", () => setMode("quiz"));
  const rm = document.getElementById("resetMiss");
  if(rm) rm.onclick = (e) => {
    e.preventDefault(); saveMiss({});
    const prev = rm.previousSibling;
    if(prev && prev.nodeType === Node.TEXT_NODE) prev.textContent = "";
    rm.replaceWith("历史统计已清零");
  };
  $("promptBar").style.display = "none";
  $("stats").textContent = `完成 ${total}/${total} ・本轮失误 ${misses}`;
}

function zoomToRegion(r){
  const w = $("stage").clientWidth, h = $("stage").clientHeight;
  if(r === null || r === undefined){ resetZoomStack(); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); return; }
  pushZoom(); // v23b: 区域跳转入栈,点海面可退回
  const fs = features.filter(f => P[f.properties.id][2] === r);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  fs.forEach(f => { const b = f._mb;
    x0=Math.min(x0,b[0][0]); y0=Math.min(y0,b[0][1]); x1=Math.max(x1,b[1][0]); y1=Math.max(y1,b[1][1]); });
  const k = Math.min(14, .85/Math.max((x1-x0)/w,(y1-y0)/h));
  const t = d3.zoomIdentity.translate(w/2-k*(x0+x1)/2, h/2-k*(y0+y1)/2).scale(k);
  svg.transition().duration(600).call(zoom.transform, t);
}

let daiFeats = null, kyoFeats = null, kyoHidden = {};
function buildDai(){
  const gs = ADMIN1.objects.adm1.geometries;
  const byKey = {}; gs.forEach(g => byKey[g.properties.a + "|" + g.properties.n] = g);
  const out = [];
  features.forEach(f => out.push({type:"Feature", // v22: 内地47県=s0010市区町村级高精度（与浏览面板同源）
    properties:{n:P[f.properties.id][0], a:"JPN", cat:0, now:""}, geometry:f.geometry}));
  DAI_UNITS.forEach(u => {
    const parts = u.adm0 ? gs.filter(g => g.properties.a === u.adm0) : u.m.map(k => byKey[k]).filter(Boolean);
    if(!parts.length) return;
    out.push({type:"Feature", properties:{n:u.n, cat:u.c, now:u.now}, geometry: cleanGeom(topojson.merge(ADMIN1, parts))});
  });
  DAI_PRECOMP.forEach(u => out.push({type:"Feature", properties:{n:u.n, cat:u.c, now:u.now}, geometry:cleanGeom(u.geometry)}));
  Object.keys(EXTRA_TERR).forEach(x => out.push({type:"Feature",
    properties:{n:EXTRA_TERR[x].name, cat:EXTRA_CAT.dainippon[x], now:EXTRA_NOW[x]},
    geometry:EXTRA_TERR[x].geometry, mkForce: x === "kantoshu", mkLabel: x === "kantoshu" ? "関東州" : undefined}));
  return out;

  // v27: 東亜全部重图层走画布(见 eaDrawNow), SVG 侧只留空壳以复用既有隐藏/清理逻辑
  gWorld.style("display","none").selectAll("path").remove();
  gWorldOut.style("display","none").selectAll("path").remove();
  eaSetup();
  eaDraw();
  return {feats: kyoFeats.units, shown};
}
function zoomToHistFeat(f){
  if(mode==="kyoeiken") eaUnitGeom(f);
  const b = path.bounds(f);
  const w = $("stage").clientWidth, h = $("stage").clientHeight;
  const k = Math.min(60, Math.max(1, .35/Math.max((b[1][0]-b[0][0])/w, (b[1][1]-b[0][1])/h)));
  const t = d3.zoomIdentity.translate(w/2 - k*(b[0][0]+b[1][0])/2, h/2 - k*(b[0][1]+b[1][1])/2).scale(k);
  svg.transition().duration(600).call(zoom.transform, t);
}
function histMarkers(kind, shown){
  if(!mkOn){ gMk.style("display","none").selectAll("*").remove(); return; }
  const mks = [];
  (ISLAND_MARKS[kind] || []).forEach(([lo,la,n,meta]) => {
    const c = projection([lo,la]);
    mks.push({key:"isl:"+n, isl:1, x:c[0], y:c[1], sz:.5, label:n, lo, la, meta});
  });
  if(kind === "dainippon" && shown){
    shown.forEach(f => {
      if(f.properties.cat === 0) return;
      const mf = mainFeature(f);
      const b = path.bounds(mf);
      const sz = Math.max(b[1][0]-b[0][0], b[1][1]-b[0][1]);
      if(sz < 24 || f.mkForce){
        const c = path.centroid(mf);
        mks.push({key:f.properties.n, f, x:c[0], y:c[1], sz, label: f.mkLabel || f.properties.n});
      }
    });
  }
  if(kind === "kyoeiken" && shown){
    const grps = {};
    shown.forEach(f => {
      if(f.properties.grp === "JPN") return;
      const mf = mainFeature(f);
      const b = path.bounds(mf);
      const sz = Math.max(b[1][0]-b[0][0], b[1][1]-b[0][1]);
      const g = grps[f.properties.grp] = grps[f.properties.grp] || {mx:-Infinity, b:[Infinity,Infinity,-Infinity,-Infinity]};
      g.mx = Math.max(g.mx, sz);
      g.b[0]=Math.min(g.b[0],b[0][0]); g.b[1]=Math.min(g.b[1],b[0][1]); g.b[2]=Math.max(g.b[2],b[1][0]); g.b[3]=Math.max(g.b[3],b[1][1]);
    });
    Object.keys(grps).forEach(grp => {
      const g = grps[grp];
      if(g.mx < 16) // 最大单元都不可辨识→挂国家标记
        mks.push({key:"c:"+grp, grp, x:(g.b[0]+g.b[2])/2, y:(g.b[1]+g.b[3])/2, sz:g.mx, label: ADM0_ZH[grp]||grp});
    });
  }
  gMk.style("display",null).selectAll("g.mk").data(mks, d => d.key)
    .join(enter => {
      const g = enter.append("g").attr("class","mk").style("cursor","pointer");
      g.append("circle");
      g.append("text").attr("class","mkt").attr("y",-14);
      return g;
    })
    .attr("transform", d => `translate(${d.x},${d.y}) scale(${1/lastK})`)
    .style("display", d => d.sz * lastK > 48 ? "none" : null)
    .each(function(d){
      d3.select(this).select("circle").attr("r", d.isl ? 12 : 9)
        .attr("class", d.isl ? "seac" : "mkc");
      d3.select(this).select("text").text(d.label);
    })
    .on("click", (ev,d) => {
      ev.stopPropagation();
      if(d.isl){
        const meta = d.meta || {};
        if(meta.hi && HI_ISL[meta.hi]){ hiFocus(meta.hi, d.label, meta.own); return; }
        if(meta.unit && kind === "kyoeiken" && kyoFeats){ // v23b:按单元实际外接框拟合(修拉克沙群岛缩到空海)
          const u = kyoFeats.units.find(x => x.properties.a + "|" + x.properties.n === meta.unit);
          if(u && !kyoHidden[u.properties.grp]){ pushZoom(); zoomToHistFeat(u); showHistInfo(u, kind); return; }
        }
        pushZoom();
        const w = $("stage").clientWidth, h = $("stage").clientHeight;
        const k = (mode === "browse") ? 150 : 400;
        const t = d3.zoomIdentity.translate(w/2 - k*d.x, h/2 - k*d.y).scale(k);
        svg.transition().duration(700).call(zoom.transform, t);
        gWorld.selectAll("path").classed("wsel", false);
        gIsl.select("path.islhl").remove();
        $("info").innerHTML = `<div class="n">${d.label}</div>` + (meta.own ? `<div class="r">${meta.own}</div>` : "");
        $("info").style.display = "block";
      }
      else if(d.f){ pushZoom(); zoomToHistFeat(d.f); showHistInfo(d.f, kind); }
      else if(d.grp){
        const u = kyoFeats.units.filter(x => x.properties.grp === d.grp);
        pushZoom(); zoomToHistGroup(u);
        if(u.length === 1) showHistInfo(u[0], kind);
        else { // v22: 多单元国家也给反馈，不再"无反应"
          $("info").innerHTML = `<div class="n">${ADM0_ZH[d.grp] || d.grp}</div><div class="r">已缩放至该国（${u.length}个一级行政区）</div>`;
          $("info").style.display = "block";
        }
      }
    });
}
function zoomToHistGroup(list){
  if(!list.length) return;
  let b = [[Infinity,Infinity],[-Infinity,-Infinity]];
  list.forEach(f => { const x = path.bounds(f);
    b[0][0]=Math.min(b[0][0],x[0][0]); b[0][1]=Math.min(b[0][1],x[0][1]);
    b[1][0]=Math.max(b[1][0],x[1][0]); b[1][1]=Math.max(b[1][1],x[1][1]); });
  const w = $("stage").clientWidth, h = $("stage").clientHeight;
  const k = Math.min(600, Math.max(1, .35/Math.max((b[1][0]-b[0][0])/w, (b[1][1]-b[0][1])/h)));
  const t = d3.zoomIdentity.translate(w/2 - k*(b[0][0]+b[1][0])/2, h/2 - k*(b[0][1]+b[1][1])/2).scale(k);
  svg.transition().duration(600).call(zoom.transform, t);
}
function zoomToPacific(kind){
  pushZoom();
  const list = kind === "dainippon"
    ? daiFeats.filter(f => f.properties.cat === 5)
    : kyoFeats.units.filter(f => ["PLW","FSM","MHL","MNP"].includes(f.properties.a));
  zoomToHistGroup(list);
  if(mode === "kyoeiken"){ eaSel = list[0] || null; eaDraw(); }
  else gWorld.selectAll("path").classed("wsel", d => list.includes(d)); // 高亮对应小岛
}
function drawSeaZones(kind){
  if(!seaOn || !(kind === "browse" || kind === "dainippon" || kind === "kyoeiken")){
    gSea.style("display","none").selectAll("*").remove(); return;
  }
  const cfg = kind === "dainippon" ? JP_SEA.dai : JP_SEA.modern;
  const a = projection(cfg.at);
  gSea.style("display",null).selectAll("*").remove();
  gSea.append("path").attr("class","seaz").attr("d", path({type:"Feature", geometry:cfg.geom}));
  gSea.append("text").attr("class","seat").datum({ax:a[0], ay:a[1]})
    .attr("transform", d => `translate(${d.ax},${d.ay}) scale(${1/lastK})`).text(cfg.label);
}
function hiFocus(k, label, own){ // 高精度岛群统一交互
  pushZoom();
  const f = {type:"Feature", geometry: HI_ISL[k]};
  const b = path.bounds(f);
  const w = $("stage").clientWidth, h = $("stage").clientHeight;
  const dw = Math.max(b[1][0] - b[0][0], 1e-6), dh = Math.max(b[1][1] - b[0][1], 1e-6);
  const cap = mode === "browse" ? 190 : 580;
  const kk = Math.max(6, Math.min(cap, 0.35 * Math.min(w / dw, h / dh)));
  const cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
  svg.transition().duration(700).call(zoom.transform,
    d3.zoomIdentity.translate(w / 2 - kk * cx, h / 2 - kk * cy).scale(kk));
  gWorld.selectAll("path").classed("wsel", false);
  gIsl.select("path.islhl").remove();
  gIsl.append("path").attr("class", "islhl").attr("d", path(f));
  $("info").innerHTML = `<div class="n">${label}</div>` + (own ? `<div class="r">${own}</div>` : "");
  $("info").style.display = "block";
}
function drawHiIslands(md){
  const data = HI_META.filter(d => md !== "browse" || d.bf);
  gIsl.style("display",null).selectAll("path").data(data, d => d.k)
    .join("path")
    .attr("d", d => path({type:"Feature", geometry:HI_ISL[d.k]}))
    .attr("fill", d => md === "browse" ? d.bf
      : (md === "dainippon" ? DAI_FILL[d.dc]
      : (d.kg === "__grey" ? "#c5ced4" : (d.kg === "JPN" ? JP_FILL : KYO_COLORS[d.kg]))))
    .attr("stroke","#8f7f72").attr("stroke-width",.4).attr("vector-effect","non-scaling-stroke")
    .style("cursor", md === "quiz" || md === "campaign" ? null : "pointer")
    .on("click", (ev, d) => { // v22: 点岛本体=点标记（此前gIsl不可交互，"点岛无反应"的另一半根因）
      if(mode === "quiz" || mode === "campaign") return;
      ev.stopPropagation();
      const key = mode === "browse" ? "browse" : mode;
      const mk = (ISLAND_MARKS[key] || []).find(m => m[3] && m[3].hi === d.k);
      hiFocus(d.k, mk ? mk[2] : d.n, mk && mk[3] ? mk[3].own : null);
    });
}
function buildHistPanel(kind, feats){
  const isDai = kind === "dainippon";
  const wasOpen = $("legend").classList.contains("open");
  let body = "";
  if(!isDai){
    const cs = [...new Set(feats.map(f => f.properties.grp).filter(g => g && g !== "JPN"))]
      .sort((a,b) => (ADM0_ZH[a]||a).localeCompare(ADM0_ZH[b]||b, "zh"));
    body += `<div id="cbGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:2px 8px;">`
      + `<label style="opacity:.55;cursor:default;"><input type="checkbox" checked disabled> 日本（固定）</label>`
      + cs.map(a => `<label style="cursor:pointer;"><input type="checkbox" data-a="${a}"${kyoHidden[a] ? "" : " checked"}> ${ADM0_ZH[a]||a}</label>`).join("")
      + `</div>`;
  }else{
    body += `<div style="color:var(--ink2);">${DAI_NOTE}</div>`;
  }
  const mkBtns = `<button class="lg-jmp" id="mkTg">标记:${mkOn?"开":"关"}</button><button class="lg-jmp" id="seaTg">海域:${seaOn?"开":"关"}</button>`;
  const jumps = isDai
    ? `<button class="lg-jmp" data-jf="関東州">関東州</button><button class="lg-jmp" data-jg="nanyo">南洋庁</button><button class="lg-jmp" data-jf="">全図</button>${mkBtns}`
    : `<button class="lg-jmp" data-jg="nanyo">南洋群島</button><button class="lg-jmp" data-jf="">全図</button>${mkBtns}`;
  $("legend").innerHTML =
    `<div class="lg-head"><b>${isDai ? DAI_TITLE : KYO_TITLE}</b><span class="lg-sel">${isDai ? "点任意行政区看详情" : "点任意国家看详情"}</span>`
    + jumps
    + `<button class="lg-toggle" id="lgToggle">${isDai ? "说明" : "显示国家"} ▾</button></div>`
    + `<div class="lg-body">${body}</div>`;
  if(wasOpen) $("legend").classList.add("open");
  const tg = document.getElementById("lgToggle");
  tg.textContent = tg.textContent.replace("▾", $("legend").classList.contains("open") ? "▴" : "▾");
  tg.onclick = () => {
    const open = $("legend").classList.toggle("open");
    tg.textContent = tg.textContent.replace(/[▾▴]/, open ? "▴" : "▾");
  };
  document.querySelectorAll("#legend .lg-jmp").forEach(b => b.onclick = () => {
    if(b.id === "mkTg"){
      mkOn = !mkOn;
      b.textContent = "标记:" + (mkOn ? "开" : "关");
      const r = drawHist(kind); histMarkers(kind, r.shown);
      return;
    }
    if(b.id === "seaTg"){
      seaOn = !seaOn;
      b.textContent = "海域:" + (seaOn ? "开" : "关");
      const sc = document.getElementById("showSea"); if(sc) sc.checked = seaOn;
      drawSeaZones(kind);
      return;
    }
    if(b.dataset.jg === "nanyo"){ zoomToPacific(kind); return; }
    const n = b.dataset.jf;
    if(!n){ svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); return; }
    const all = kind === "dainippon" ? daiFeats : kyoFeats.units;
    const f = all.find(x => x.properties.n === n || x.properties.n.startsWith(n));
    if(f){ zoomToHistFeat(f); showHistInfo(f, kind); }
  });
  if(!isDai) document.querySelectorAll("#cbGrid input[data-a]").forEach(cb => cb.onchange = () => {
    kyoHidden[cb.dataset.a] = !cb.checked;
    const r = drawHist("kyoeiken"); // 只重绘要素，不动视角、不重建面板
    histMarkers("kyoeiken", r.shown);
    histLblFeats = r.shown;
    updateLabels();
  });
  $("legend").style.display = "block";
}
function enterHist(kind){
  if(kind==="dainippon" && !ADMIN1){ $("loading").style.display="block";
    fetch("admin1.topojson").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(t=>{ ADMIN1=t; $("loading").style.display="none"; if(mode==="dainippon") enterHist("dainippon"); })
      .catch(e=>{ $("loading").style.display="none"; alert("大日本地图数据加载失败: "+e.message); }); return; }
  if(kind==="kyoeiken" && !EA[0]){ $("loading").style.display="block";
    eaLoad(0,()=>{ $("loading").style.display="none"; eaLoad(1); if(mode==="kyoeiken") enterHist("kyoeiken"); }); return; }
  projection.clipExtent(null); eaRefine._clip=null; eaTier=-1; // fitExtent前必须清投影裁剪; 档位标记复位以便重绘
  resetZoomStack();
  if(zoom) zoom.scaleExtent([1,600]); // 环礁级小岛需极深缩放（NE10m分辨率上限内）
  $("jumps").style.display = "none";
  $("info").style.display = "none";
  $("info").style.top = "8px"; $("info").style.bottom = "auto"; // hist下信息卡置右上，避让底部面板
  gMap.style("display","none"); gHl.style("display","none");
  if(kind === "dainippon"){
    gCtx.style("display",null).selectAll("path").data([DAI_CTX]).join("path")
      .attr("fill","#f4f1ea").attr("stroke","#cfc7bb").attr("stroke-width",.5)
      .attr("vector-effect","non-scaling-stroke").attr("pointer-events","none");
  } else gCtx.style("display","none");
  const r = drawHist(kind);
  const w = $("stage").clientWidth, h = $("stage").clientHeight;
  projection.rotate([-150,0]);
  const fitFeats = r.feats.filter(f => d3.geoArea(f) > 5e-5); // fit用全量：勾选隐藏不跳视角
  projection.fitExtent([[16,56],[w-16,h-64]], {type:"FeatureCollection", features: fitFeats.length ? fitFeats : r.feats});
  gWorld.selectAll("path").attr("d", path);
  gCtx.selectAll("path").attr("d", path);
  svg.call(zoom.transform, d3.zoomIdentity);
  r.feats.forEach(f => { f._c = null; f._mb = null; }); // 投影已变，标签几何缓存失效
  histLblFeats = r.shown;
  updateLabels();
  histMarkers(kind, r.shown);
  if(kind==="kyoeiken"){ eaInvalidate(); eaRefine(); } // 换投影后 Path2D 缓存全失效
  drawSeaZones(kind);
  drawHiIslands(kind);
  buildHistPanel(kind, r.feats);
}
const JUMP_REGION = {all:null, r1:1, r2:2, r3:3, r4:4, r5:5, r6:6, r7:7};
document.querySelectorAll("#jumps button").forEach(b => b.onclick = () => zoomToRegion(JUMP_REGION[b.dataset.j]));
let rsT = null;
window.addEventListener("resize", () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    if(!features) return;
    if(mode === "dainippon" || mode === "kyoeiken"){ enterHist(mode); return; }
    const w = $("stage").clientWidth, h = $("stage").clientHeight;
    projection.rotate([0,0]);
    projection.fitExtent([[20,60],[w-20,h-20]], mainFC);
    gMap.selectAll("path").attr("d", path);
    gHl.selectAll("path").attr("d", d => path(d));
    computeGeom();
    updateLabels();
    if(mode === "browse"){ drawSeaZones("browse"); histMarkers("browse", null); }
    drawHiIslands("browse");
  }, 150); // 防抖：历史视图resize要整体重建路径
});
