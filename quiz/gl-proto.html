<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>東亜地図 WebGL 原型</title>
<!--
  渲染架构原型 (对照现版 quiz/japan-map-quiz.html 的 Canvas2D 方案)。
  原理: 本图投影是墨卡托 => 缩放平移是纯仿射变换 => 全部顶点可以在加载时一次性投影+三角化,
        上传 GPU 常驻; 之后每帧只改一个矩阵 uniform, CPU 每帧零几何工作。
  于是现版的分档(LOD)/按帧烘焙/视口裁剪/Path2D缓存/低分辨率手势 全部不需要, 一并删除。
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dcebf5;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #hud{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:8px;padding:8px 11px;
       font-size:12px;line-height:1.6;color:#1B2433;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5;}
  #hud b{font-size:14px}
  #fps{font-variant-numeric:tabular-nums;font-weight:700}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        background:#dcebf5;color:#33415C;font-size:14px;z-index:9;text-align:center;padding:20px;}
  #back{position:absolute;right:10px;bottom:12px;z-index:5;background:#fff;border:1px solid #C9D2DB;border-radius:20px;
        padding:8px 14px;font-size:13px;text-decoration:none;color:#1B2433;box-shadow:0 2px 8px rgba(0,0,0,.15);}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><b>WebGL 原型</b><br>帧时 <span id="fps">—</span><br><span id="info">加载中…</span></div>
<a id="back" href="japan-map-quiz.html">← 现行版对比</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const KYO_COLORS = {"CHN": "#e2806e", "KOR": "#9db8e0", "PRK": "#7d8fbd", "VNM": "#c96058", "LAO": "#b3b8e0", "THA": "#7d99cc", "KHM": "#e3c495", "MMR": "#a8cf9f", "MYS": "#e8d48a", "SGP": "#e6a0a0", "BRN": "#cba96e", "IDN": "#e29184", "TLS": "#e5cf8f", "PNG": "#d4a86a", "PHL": "#94aede", "IND": "#eeb27f", "LKA": "#c78d64", "NPL": "#b95f6e", "BTN": "#f0d75f", "BGD": "#97c9a2", "PLW": "#a5cde3", "FSM": "#86a9d4", "MHL": "#b5d3ea", "MNP": "#93b0d9", "TWN": "#86c3a8", "RUS": "#b8c4dd", "MNG": "#b7d3a1", "MDV": "#8fb8d8"};
const JP_FILL="#f2ede6", WATER="#bcd8ec", RIVER="#9dc2dd", BORDER="#5f5348";
const hex=c=>[parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255];
const cv=document.getElementById("cv");
const gl=cv.getContext("webgl",{antialias:true,alpha:false});
if(!gl){document.getElementById("load").textContent="此浏览器不支持 WebGL";}
const VS=`attribute vec2 a;uniform float k;uniform vec2 t;uniform vec2 res;
void main(){vec2 s=a*k+t;gl_Position=vec4(2.0*s.x/res.x-1.0,1.0-2.0*s.y/res.y,0.0,1.0);}`;
const FS=`precision mediump float;uniform vec4 col;void main(){gl_FragColor=col;}`;
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);
const A=gl.getAttribLocation(prog,"a"), U={k:gl.getUniformLocation(prog,"k"),t:gl.getUniformLocation(prog,"t"),
  res:gl.getUniformLocation(prog,"res"),col:gl.getUniformLocation(prog,"col")};
gl.enableVertexAttribArray(A);

let projection, batches=[], lineBatch=null, riverBatch=null, tr={k:1,x:0,y:0}, dpr=Math.min(devicePixelRatio||1,2);
function resize(){ cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  gl.viewport(0,0,cv.width,cv.height); }
function upload(arr){ const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW); return b; }

// —— 一次性: 投影 + 三角化 + 上传 ——
function build(topo){
  const w=innerWidth,h=innerHeight;
  const units=topojson.feature(topo,topo.objects.units).features;
  projection=d3.geoMercator().rotate([-150,0]);
  projection.fitExtent([[16,56],[w-16,h-64]],{type:"FeatureCollection",features:units});
  const P=projection;
  const byColor=new Map();
  const lines=[];
  const push=(arr,x,y)=>{arr.push(x,y);};
  units.forEach(u=>{
    const col=u.properties.grp==="JPN"?JP_FILL:(KYO_COLORS[u.properties.grp]||"#ccc");
    if(!byColor.has(col)) byColor.set(col,[]);
    const tris=byColor.get(col);
    const polys=u.geometry.type==="MultiPolygon"?u.geometry.coordinates:[u.geometry.coordinates];
    polys.forEach(pl=>{
      const flat=[],holes=[];let n=0;
      pl.forEach((ring,ri)=>{
        if(ri>0) holes.push(n);
        for(let i=0;i<ring.length-1;i++){const p=P(ring[i]); if(!p)continue; flat.push(p[0],p[1]); n++;}
        // 边界线段
        for(let i=0;i<ring.length-1;i++){const a=P(ring[i]),b=P(ring[i+1]); if(a&&b) lines.push(a[0],a[1],b[0],b[1]);}
      });
      if(n<3) return;
      const idx=earcut(flat,holes,2);
      for(let i=0;i<idx.length;i++){ tris.push(flat[idx[i]*2],flat[idx[i]*2+1]); }
    });
  });
  batches=[...byColor.entries()].map(([c,arr])=>({buf:upload(new Float32Array(arr)),n:arr.length/2,col:hex(c)}));
  lineBatch={buf:upload(new Float32Array(lines)),n:lines.length/2,col:hex(BORDER)};
  // 湖泊 + 河流
  const wt=topo.objects.water?topojson.feature(topo,topo.objects.water).features:[];
  const wtri=[];
  wt.forEach(f=>{ (f.geometry.type==="MultiPolygon"?f.geometry.coordinates:[f.geometry.coordinates]).forEach(pl=>{
    const flat=[],holes=[];let n=0;
    pl.forEach((ring,ri)=>{ if(ri>0)holes.push(n);
      for(let i=0;i<ring.length-1;i++){const p=P(ring[i]); if(!p)continue; flat.push(p[0],p[1]); n++;} });
    if(n<3)return; const idx=earcut(flat,holes,2);
    for(let i=0;i<idx.length;i++) wtri.push(flat[idx[i]*2],flat[idx[i]*2+1]); }); });
  const rv=topo.objects.rivers?topojson.feature(topo,topo.objects.rivers).features:[];
  const rl=[];
  rv.forEach(f=>{ const ls=f.geometry.type==="MultiLineString"?f.geometry.coordinates:[f.geometry.coordinates];
    ls.forEach(line=>{ for(let i=0;i<line.length-1;i++){const a=P(line[i]),b=P(line[i+1]); if(a&&b) rl.push(a[0],a[1],b[0],b[1]); } }); });
  batches.push({buf:upload(new Float32Array(wtri)),n:wtri.length/2,col:hex(WATER),water:true});
  riverBatch={buf:upload(new Float32Array(rl)),n:rl.length/2,col:hex(RIVER)};
  const total=batches.reduce((s,b)=>s+b.n,0)+lineBatch.n+riverBatch.n;
  document.getElementById("info").innerHTML=
    units.length+" 个单元 · "+(total/1e6).toFixed(2)+"M 顶点常驻 GPU<br>全精度，无分档、无瓦片";
}
let frames=[],last=performance.now();
function draw(){
  const t0=performance.now();
  gl.clearColor(0.863,0.922,0.961,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.k,tr.k*dpr); gl.uniform2f(U.t,tr.x*dpr,tr.y*dpr); gl.uniform2f(U.res,cv.width,cv.height);
  for(const b of batches){ if(b.water) continue;
    gl.bindBuffer(gl.ARRAY_BUFFER,b.buf); gl.vertexAttribPointer(A,2,gl.FLOAT,false,0,0);
    gl.uniform4f(U.col,b.col[0],b.col[1],b.col[2],1); gl.drawArrays(gl.TRIANGLES,0,b.n); }
  gl.bindBuffer(gl.ARRAY_BUFFER,lineBatch.buf); gl.vertexAttribPointer(A,2,gl.FLOAT,false,0,0);
  gl.uniform4f(U.col,lineBatch.col[0],lineBatch.col[1],lineBatch.col[2],1); gl.drawArrays(gl.LINES,0,lineBatch.n);
  for(const b of batches){ if(!b.water) continue;
    gl.bindBuffer(gl.ARRAY_BUFFER,b.buf); gl.vertexAttribPointer(A,2,gl.FLOAT,false,0,0);
    gl.uniform4f(U.col,b.col[0],b.col[1],b.col[2],1); gl.drawArrays(gl.TRIANGLES,0,b.n); }
  gl.bindBuffer(gl.ARRAY_BUFFER,riverBatch.buf); gl.vertexAttribPointer(A,2,gl.FLOAT,false,0,0);
  gl.uniform4f(U.col,riverBatch.col[0],riverBatch.col[1],riverBatch.col[2],1); gl.drawArrays(gl.LINES,0,riverBatch.n);
  const now=performance.now(); frames.push(now-last); last=now; if(frames.length>40)frames.shift();
  const s=[...frames].sort((a,b)=>a-b);
  document.getElementById("fps").textContent = s.length? (s[Math.floor(s.length/2)].toFixed(0)+"ms  (绘制 "+(now-t0).toFixed(1)+"ms)") : "—";
}
